<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>WeBlock - Inversiones Inmobiliarias</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #030816;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-serif-title { font-family: 'Playfair Display', serif; }

    /* ESTILOS DE TARJETAS APILADAS (PROYECTOS) EXACTOS A LA FOTO */
    .stacked-container {
      display: flex;
      flex-direction: column;
      padding-bottom: 30px;
    }

    .stacked-card {
      margin-bottom: -135px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      cursor: pointer;
    }

    .stacked-card:last-child {
      margin-bottom: 0;
    }

    .stacked-card:hover {
      transform: translateY(-12px);
      z-index: 50 !important;
    }

    /* COLORES Y FONDOS CON DEGRADADO + IMAGEN FOTOGRÁFICA */
    .card-blue {
      background: linear-gradient(135deg, rgba(6, 26, 68, 0.94) 0%, rgba(3, 12, 34, 0.98) 100%), 
                  url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(37, 99, 235, 0.5);
      box-shadow: 0 15px 35px -5px rgba(29, 78, 216, 0.4);
    }

    .card-green {
      background: linear-gradient(135deg, rgba(4, 38, 24, 0.92) 0%, rgba(2, 18, 11, 0.96) 100%), 
                  url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 15px 35px -5px rgba(16, 185, 129, 0.25);
    }

    .card-amber {
      background: linear-gradient(135deg, rgba(45, 28, 4, 0.92) 0%, rgba(18, 11, 2, 0.96) 100%), 
                  url('https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(217, 119, 6, 0.4);
      box-shadow: 0 15px 35px -5px rgba(217, 119, 6, 0.25);
    }

    .card-purple {
      background: linear-gradient(135deg, rgba(30, 14, 52, 0.92) 0%, rgba(13, 4, 23, 0.96) 100%), 
                  url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 15px 35px -5px rgba(139, 92, 246, 0.25);
    }

    .glass-box {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }


    /* =========================================================
       WEBLOCK - INICIO RESPONSIVE
       Desktop: dashboard amplio como la referencia.
       Mobile: layout compacto tipo app.
       ========================================================= */

    .weblock-logo-crop {
      width: 188px;
      height: 52px;
      position: relative;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .weblock-logo-image {
      width: 120px;
      height: auto;
      max-width: none;
      display: block;
      transform: scale(1.04);
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 10px rgba(37,99,235,.20));
    }

    .weblock-logo-large {
      width: 220px;
      height: 64px;
      overflow: visible;
    }

    .weblock-logo-large .weblock-logo-image {
      width: 245px;
    }

    .home-dashboard {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .home-hero {
      min-height: 250px;
    }

    .home-patrimony {
      margin-top: -22px;
    }

    .home-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .home-stat-card {
      min-width: 0;
      min-height: 150px;
    }

    @media (max-width: 767px) {
      .weblock-logo-crop {
        width: 175px;
        height: 48px;
        overflow: visible;
      }

      .weblock-logo-image {
        width: 175px;
      }

      .weblock-logo-large {
        width: 190px;
        height: 56px;
      }

      .weblock-logo-large .weblock-logo-image {
        width: 215px;
      }

      .home-dashboard {
        max-width: none;
      }

      .home-hero {
        min-height: 230px;
      }

      .home-stats-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .home-stat-card {
        min-height: auto;
      }
    }



    /* =========================================================
       WEBLOCK - REDISEÑO UI/UX 2026
       ========================================================= */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .project-card-unified {
      width: 100%;
      min-width: 0;
      aspect-ratio: 1 / 1;
      min-height: 290px;
      position: relative;
      overflow: hidden;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.10);
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .project-card-unified:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
      border-color: rgba(59,130,246,.45);
    }

    .project-card-unified .project-state {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 4;
      font-size: 12px;
    }

    .project-card-unified .project-arrow,
    .module-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(2,8,22,.55);
      color: white;
      font-size: 18px;
      flex-shrink: 0;
    }

    .project-card-unified .project-arrow {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 4;
    }

    .detail-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .detail-tab {
      white-space: nowrap;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #24314b;
      background: #0b1323;
      color: #94a3b8;
    }
    .detail-tab.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #3b82f6;
    }
    .gallery-wrap {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(180px, 1fr);
      gap: 12px;
    }
    .gallery-main {
      position: relative;
      min-height: 340px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      background: #0a1222;
    }
    .gallery-main img {
      width: 100%;
      height: 100%;
      min-height: 340px;
      object-fit: cover;
      display: block;
    }
    .gallery-side {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
    }
    .gallery-side button {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.08);
      background: #0a1222;
      padding: 0;
    }
    .gallery-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .detail-media {
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      background: #0a1222;
    }
    .detail-media img, .detail-media video {
      width: 100%;
      display: block;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .metric-card {
      position: relative;
      min-height: 138px;
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(15,23,42,.78);
    }
    .metric-card .module-arrow {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      font-size: 15px;
    }
    .info-module {
      position: relative;
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(15,23,42,.78);
    }
    .info-module .module-arrow {
      position: absolute;
      top: 14px;
      right: 14px;
    }
    @media (max-width: 1100px) {
      .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 767px) {
      .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .project-card-unified { min-height: 220px; padding: 14px; border-radius: 20px; }
      .project-card-unified .project-state { top: 12px; left: 12px; font-size: 10px; }
      .project-card-unified .project-arrow { top: 12px; right: 12px; width: 34px; height: 34px; }
      .gallery-wrap { grid-template-columns: 1fr; }
      .gallery-main, .gallery-main img { min-height: 250px; }
      .gallery-side { grid-template-columns: 1fr 1fr; grid-template-rows: 120px; }
      .metric-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .metric-card { min-height: 130px; padding: 14px; }
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-full bg-[#030816] text-white">

  <div id="root" class="w-full h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONFIGURACIÓN SUPABASE ---
    const SUPABASE_URL = "https://jyqavprfowwhzjfcwlsh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WIxlCKHdUlFBJM--qnpQ0w_VlU_CM3i";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // LOGO WEBLOCK: LogoWeBlock.png
    // El blend "screen" hace que el fondo negro del PNG se camufle con el fondo de la web.
    const WeBlockLogo = ({ large = false }) => (
      <div className={`weblock-logo-crop ${large ? 'weblock-logo-large' : ''}`}>
        <img
          src="./Logo.png"
          alt="WeBlock"
          className="weblock-logo-image"
        />
      </div>
    );

    // ICONOS DE LA BARRA INFERIOR Y SECCIONES
    const IconInicio = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    );

    const IconProyectos = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4M9 7h1m-1 4h1m4-4h1m-1 4h1" />
      </svg>
    );

    const IconMovimientos = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m-8 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconPerfil = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    );

    // --- COMPONENTE DE AUTENTICACIÓN COMPLETO ---
    const AuthScreen = ({ onAuthSuccess }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [nombre, setNombre] = useState('');
      const [apellido, setApellido] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [repeatPassword, setRepeatPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        const savedEmail = localStorage.getItem('weblock_remember_email');
        const savedPassword = localStorage.getItem('weblock_remember_password');
        if (savedEmail && savedPassword) {
          setEmail(savedEmail);
          setPassword(savedPassword);
          setRememberMe(true);
        }
      }, []);

      const getPasswordStrength = (pass) => {
        if (!pass) return { score: 0, label: '', color: 'bg-slate-800' };
        let score = 0;
        if (pass.length > 0) score += 1;
        if (pass.length >= 6) score += 1;
        if (/[0-9]/.test(pass)) score += 1;
        if (/[@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass)) score += 1;

        if (pass.length <= 5 && score <= 2) {
          return { score: 25, label: 'Débil', color: 'bg-red-500', textColor: 'text-red-400' };
        } else if (score === 2 || score === 3) {
          return { score: 50, label: 'Media', color: 'bg-amber-500', textColor: 'text-amber-400' };
        } else if (score === 4 && pass.length >= 8) {
          return { score: 100, label: 'Muy Fuerte', color: 'bg-emerald-400', textColor: 'text-emerald-300' };
        } else {
          return { score: 75, label: 'Fuerte', color: 'bg-emerald-500', textColor: 'text-emerald-400' };
        }
      };

      const strength = getPasswordStrength(password);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (rememberMe) {
          localStorage.setItem('weblock_remember_email', email);
          localStorage.setItem('weblock_remember_password', password);
        } else {
          localStorage.removeItem('weblock_remember_email');
          localStorage.removeItem('weblock_remember_password');
        }

        if (!isLogin) {
          if (password !== repeatPassword) {
            setErrorMsg('Las contraseñas no coinciden');
            return;
          }
          if (password.length < 6) {
            setErrorMsg('La contraseña debe tener al menos 6 caracteres');
            return;
          }
        }

        try {
          if (isLogin) {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            onAuthSuccess(data.user);
          } else {
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: { 
                data: { 
                  full_name: `${nombre} ${apellido}`.trim(),
                  first_name: nombre,
                  last_name: apellido,
                } 
              }
            });
            if (error) throw error;
            onAuthSuccess(data.user);
          }
        } catch (err) {
          setErrorMsg(err.message || 'Error al iniciar sesión');
        }
      };

      return (
        <div className="fixed inset-0 bg-[#030816] z-50 flex flex-col justify-center px-6 overflow-y-auto py-8">
          <div className="flex flex-col items-center mb-6">
            <WeBlockLogo />
            <p className="text-xs text-slate-400 mt-1">{isLogin ? 'Ingresá a tu cuenta' : 'Creá tu cuenta de inversor'}</p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-3.5 max-w-sm mx-auto w-full">
            
            {!isLogin && (
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Nombre</label>
                  <input 
                    type="text" 
                    value={nombre} 
                    onChange={(e) => setNombre(e.target.value)} 
                    required
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                    placeholder="Ej: Axel"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Apellido</label>
                  <input 
                    type="text" 
                    value={apellido} 
                    onChange={(e) => setApellido(e.target.value)} 
                    required
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                    placeholder="Ej: DiBella"
                  />
                </div>
              </div>
            )}

            <div>
              <label className="text-xs text-slate-400 block mb-1">Mail</label>
              <input 
                type="email" 
                value={email} 
                onChange={(e) => setEmail(e.target.value)} 
                required
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                placeholder="tu@email.com"
              />
            </div>

            <div>
              <label className="text-xs text-slate-400 block mb-1">Contraseña</label>
              <input 
                type="password" 
                value={password} 
                onChange={(e) => setPassword(e.target.value)} 
                required
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                placeholder="••••••••"
              />
              
              {!isLogin && password.length > 0 && (
                <div className="mt-2 space-y-1">
                  <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                    <div className={`h-full transition-all duration-300 ${strength.color}`} style={{ width: `${strength.score}%` }}></div>
                  </div>
                  <div className="flex justify-between items-center text-[10px]">
                    <span className="text-slate-500">Seguridad: <strong className={strength.textColor}>{strength.label}</strong></span>
                    <span className="text-slate-500 font-mono">+6 letras y números</span>
                  </div>
                </div>
              )}
            </div>

            {!isLogin && (
              <div>
                <label className="text-xs text-slate-400 block mb-1">Repetir contraseña</label>
                <input 
                  type="password" 
                  value={repeatPassword} 
                  onChange={(e) => setRepeatPassword(e.target.value)} 
                  required
                  className={`w-full bg-slate-900 border rounded-xl px-3.5 py-2.5 text-sm outline-none ${
                    repeatPassword && password !== repeatPassword ? 'border-red-500' : 'border-slate-800 focus:border-blue-500'
                  }`}
                  placeholder="••••••••"
                />
              </div>
            )}

            <div className="flex items-center justify-between pt-1">
              <label className="flex items-center gap-2 cursor-pointer select-none">
                <input 
                  type="checkbox" 
                  checked={rememberMe} 
                  onChange={(e) => setRememberMe(e.target.checked)}
                  className="w-4 h-4 rounded bg-slate-900 border-slate-800 text-blue-600 focus:ring-0 cursor-pointer accent-blue-600"
                />
                <span className="text-xs text-slate-400">Recordarme</span>
              </label>
              {isLogin && <a href="#" className="text-[11px] text-blue-400 hover:underline">¿Olvidaste tu clave?</a>}
            </div>

            {errorMsg && <p className="text-xs text-red-400 text-center py-1">{errorMsg}</p>}

            <button type="submit" className="w-full py-3.5 rounded-xl bg-blue-600 font-bold text-sm hover:bg-blue-500 transition shadow-lg shadow-blue-600/30">
              {isLogin ? 'Iniciar Sesión' : 'Registrarse'}
            </button>

            <p className="text-xs text-center text-slate-400 mt-4 cursor-pointer" onClick={() => { setIsLogin(!isLogin); setErrorMsg(''); }}>
              {isLogin ? '¿No tenés cuenta? Registrate aquí' : '¿Ya tenés cuenta? Iniciá sesión'}
            </p>
          </form>
        </div>
      );
    };


    // ==================== PERFIL: SECCIONES FUNCIONALES ====================
    const ProfileSection = ({ section, user, profile, onBack }) => {
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState('');
      const [error, setError] = useState('');

      const rawRole = profile?.Role || profile?.role || 'cliente';
      const normalizedRole = String(rawRole).toLowerCase();
      const canManageDocuments = ['admin', 'dueño', 'owner'].includes(normalizedRole);
      const canAccessAdministration = ['admin', 'dueño', 'owner'].includes(normalizedRole);

      const [firstName, setFirstName] = useState(profile?.nombre || user?.user_metadata?.first_name || '');
      const [lastName, setLastName] = useState(profile?.apellido || user?.user_metadata?.last_name || '');
      const [phone, setPhone] = useState(profile?.telefono || user?.user_metadata?.phone || '');

      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [repeatNewPassword, setRepeatNewPassword] = useState('');
      const [notifications, setNotifications] = useState(() => localStorage.getItem('weblock_notifications') !== 'false');
      const [ringtone, setRingtone] = useState(() => localStorage.getItem('weblock_ringtone') || 'classic');

      const [documents, setDocuments] = useState([]);
      const [documentsLoading, setDocumentsLoading] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [visibility, setVisibility] = useState('all');
      const [users, setUsers] = useState([]);
      const [selectedUserIds, setSelectedUserIds] = useState([]);
      const [loadingUsers, setLoadingUsers] = useState(false);
      const [adminUsers, setAdminUsers] = useState([]);
      const [adminLoading, setAdminLoading] = useState(false);
      const [adminLastUpdate, setAdminLastUpdate] = useState(null);

      useEffect(() => {
        if (section === 'documentos') {
          loadDocuments();
          if (canManageDocuments) loadUsers();
        }
        if (section === 'administracion' && canAccessAdministration) {
          loadAdministration();
        }
      }, [section, canManageDocuments, canAccessAdministration]);

      const loadDocuments = async () => {
        setDocumentsLoading(true);
        setError('');
        const { data, error } = await supabase.from('documents').select('*').order('created_at', { ascending: false });
        if (error) {
          setError('No se pudieron cargar los documentos: ' + error.message);
          setDocuments([]);
        } else setDocuments(data || []);
        setDocumentsLoading(false);
      };

      const loadUsers = async () => {
        setLoadingUsers(true);
        const { data, error } = await supabase
          .from('profiles')
          .select('id,email,nombre,apellido,"Role"')
          .order('email', { ascending: true });

        if (error) {
          setUsers([]);
          setError('No se pudieron cargar los usuarios. Hay que agregar una policy para que Admin/Dueño puedan ver la lista.');
        } else {
          setUsers((data || []).filter(u => u.id !== user.id));
        }
        setLoadingUsers(false);
      };

      const loadAdministration = async () => {
        setAdminLoading(true);
        setError('');
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .order('email', { ascending: true });

        if (error) {
          setAdminUsers([]);
          setError('No se pudieron cargar los usuarios registrados: ' + error.message);
        } else {
          setAdminUsers(data || []);
          setAdminLastUpdate(new Date());
        }
        setAdminLoading(false);
      };

      const savePersonalInfo = async (e) => {
        e.preventDefault();
        setLoading(true); setError(''); setMessage('');

        const { error: profileError } = await supabase.from('profiles').update({
          nombre: firstName,
          apellido: lastName,
          telefono: phone
        }).eq('id', user.id);

        if (profileError) {
          setLoading(false);
          setError(profileError.message);
          return;
        }

        const { error: authError } = await supabase.auth.updateUser({
          data: { first_name: firstName, last_name: lastName, full_name: `${firstName} ${lastName}`.trim(), phone }
        });

        setLoading(false);
        if (authError) setError(authError.message);
        else setMessage('Información actualizada correctamente.');
      };

      const changePassword = async (e) => {
        e.preventDefault();
        setLoading(true); setError(''); setMessage('');
        if (newPassword.length < 6) { setLoading(false); setError('La nueva contraseña debe tener al menos 6 caracteres.'); return; }
        if (newPassword !== repeatNewPassword) { setLoading(false); setError('Las nuevas contraseñas no coinciden.'); return; }

        const { error: loginError } = await supabase.auth.signInWithPassword({ email: user.email, password: currentPassword });
        if (loginError) { setLoading(false); setError('La contraseña actual es incorrecta.'); return; }

        const { error } = await supabase.auth.updateUser({ password: newPassword });
        setLoading(false);
        if (error) setError(error.message);
        else {
          setMessage('Contraseña actualizada correctamente.');
          setCurrentPassword(''); setNewPassword(''); setRepeatNewPassword('');
        }
      };

      const toggleNotifications = (value) => {
        setNotifications(value);
        localStorage.setItem('weblock_notifications', String(value));
      };

      const changeRingtone = (value) => {
        setRingtone(value);
        localStorage.setItem('weblock_ringtone', value);
      };

      const playRingtone = () => {
        const institutional = new Audio('./media/weblock-notificacion.mp3');
        institutional.volume = 0.85;
        institutional.play().catch(() => {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = 880;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.35);
          } catch (_) {}
        });
      };

      const toggleUser = (id) => {
        setSelectedUserIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const uploadDocument = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !canManageDocuments) return;

        if (visibility === 'specific' && selectedUserIds.length === 0) {
          setError('Elegí al menos un usuario para este documento.');
          e.target.value = '';
          return;
        }

        setUploading(true); setError(''); setMessage('');

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const storagePath = `${user.id}/${Date.now()}_${safeName}`;

        const { error: uploadError } = await supabase.storage.from('documents').upload(storagePath, file, { upsert: false });
        if (uploadError) {
          setUploading(false); setError(uploadError.message); e.target.value = ''; return;
        }

        const { data: doc, error: dbError } = await supabase.from('documents').insert({
          name: file.name,
          storage_path: storagePath,
          uploaded_by: user.id,
          visibility: visibility === 'specific' ? 'specific' : visibility
        }).select().single();

        if (dbError) {
          await supabase.storage.from('documents').remove([storagePath]);
          setUploading(false); setError(dbError.message); e.target.value = ''; return;
        }

        if (visibility === 'specific') {
          const permissions = selectedUserIds.map(userId => ({ document_id: doc.id, user_id: userId }));
          const { error: permissionsError } = await supabase.from('document_permissions').insert(permissions);

          if (permissionsError) {
            await supabase.from('documents').delete().eq('id', doc.id);
            await supabase.storage.from('documents').remove([storagePath]);
            setUploading(false); setError(permissionsError.message); e.target.value = ''; return;
          }
        }

        setUploading(false);
        setMessage('Documento subido correctamente.');
        setSelectedUserIds([]);
        setVisibility('all');
        await loadDocuments();
        e.target.value = '';
      };

      const getStoragePath = (doc) => {
        let storagePath = String(doc?.storage_path || doc?.path || '').replace(/^\/+/, '');
        if (storagePath.startsWith('documents/')) storagePath = storagePath.slice('documents/'.length);
        return storagePath;
      };

      const openDocument = async (doc) => {
        setError('');
        const storagePath = getStoragePath(doc);
        if (!storagePath) { setError('Este documento no tiene una ruta válida.'); return; }

        const { data, error } = await supabase.storage.from('documents').createSignedUrl(storagePath, 300);
        if (error || !data?.signedUrl) {
          console.error('Error abriendo documento:', { doc, storagePath, error });
          setError('No se pudo abrir el documento. La ruta guardada no coincide con el archivo del bucket.');
          return;
        }
        window.open(data.signedUrl, '_blank', 'noopener,noreferrer');
      };

      const deleteDocument = async (doc) => {
        if (!canManageDocuments) return;
        if (!window.confirm(`¿Querés eliminar \"${doc.name}\"?`)) return;

        setError('');
        setMessage('');
        const storagePath = getStoragePath(doc);

        const { error: storageError } = await supabase.storage.from('documents').remove([storagePath]);
        if (storageError) {
          console.error(storageError);
          setError('No se pudo eliminar el archivo: ' + storageError.message);
          return;
        }

        const { error: dbError } = await supabase.from('documents').delete().eq('id', doc.id);
        if (dbError) {
          setError('El archivo se eliminó de Storage, pero no su registro: ' + dbError.message);
          await loadDocuments();
          return;
        }

        setMessage('Documento eliminado correctamente.');
        await loadDocuments();
      };

      const roleLabel = normalizedRole === 'dueño' || normalizedRole === 'owner' ? 'Dueño'
        : normalizedRole === 'admin' ? 'Administrador' : 'Cliente';

      const titleMap = {
        informacion: ['Información personal', 'Tus datos personales y de contacto'],
        seguridad: ['Seguridad', 'Cambiá tu contraseña de acceso'],
        notificaciones: ['Notificaciones', 'Configurá cómo querés recibir avisos'],
        documentos: ['Documentos', 'Contratos, informes y comprobantes'],
        administracion: ['Administración', 'Usuarios, roles e información de la cuenta']
      };

      useEffect(() => {
        if (section === 'soporte') {
          const supportNumber = '549XXXXXXXXXX';
          window.open(`https://wa.me/${supportNumber}?text=${encodeURIComponent('Hola, necesito ayuda con WeBlock.')}`, '_blank', 'noopener,noreferrer');
          onBack();
        }
      }, [section]);

      if (section === 'soporte') return null;
      if (section === 'administracion' && !canAccessAdministration) {
        onBack();
        return null;
      }
      const [title, subtitle] = titleMap[section] || ['', ''];

      const userFullNameSafe = (p, currentUser) =>
        `${p?.nombre || currentUser?.user_metadata?.first_name || ''} ${p?.apellido || currentUser?.user_metadata?.last_name || ''}`.trim() || 'Usuario';

      return (
        <div className="space-y-5 animate-fadeIn pb-8">
          <div className="flex items-center gap-3">
            <button onClick={onBack} className="w-10 h-10 rounded-full bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-xl">‹</button>
            <div><h1 className="text-3xl font-extrabold text-white">{title}</h1><p className="text-xs text-slate-400 mt-1">{subtitle}</p></div>
          </div>

          {message && <div className="p-3 rounded-xl bg-emerald-950/50 border border-emerald-800/50 text-emerald-400 text-xs">✓ {message}</div>}
          {error && <div className="p-3 rounded-xl bg-red-950/50 border border-red-800/50 text-red-400 text-xs">{error}</div>}

          {section === 'informacion' && (
            <form onSubmit={savePersonalInfo} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
              {[
                ['Nombre', firstName, setFirstName, 'Ej: Axel'],
                ['Apellido', lastName, setLastName, 'Ej: DiBella'],
                ['Mail', user.email || '', () => {}, 'tu@email.com']
              ].map(([label, value, setter, placeholder]) => (
                <div key={label}>
                  <label className="text-xs text-slate-400 block mb-1">{label}</label>
                  <input value={value} onChange={e => setter(e.target.value)} disabled={label === 'Mail'} placeholder={placeholder} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500 disabled:opacity-60" />
                </div>
              ))}
              <div>
                <label className="text-xs text-slate-400 block mb-1">Número de teléfono</label>
                <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="Opcional" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" />
              </div>
              <div>
                <label className="text-xs text-slate-400 block mb-1">Qué sos</label>
                <select value={normalizedRole === 'dueño' || normalizedRole === 'owner' ? 'dueño' : normalizedRole === 'admin' ? 'admin' : 'cliente'} disabled className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none opacity-70">
                  <option value="cliente">Cliente</option><option value="admin">Administrador</option><option value="dueño">Dueño</option>
                </select>
                <p className="text-[11px] text-slate-500 mt-1">El rol lo administra WeBlock y no puede modificarse desde este perfil.</p>
              </div>
              <button disabled={loading} className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-sm disabled:opacity-50">{loading ? 'Guardando...' : 'Guardar cambios'}</button>
            </form>
          )}

          {section === 'seguridad' && (
            <form onSubmit={changePassword} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
              <div><label className="text-xs text-slate-400 block mb-1">Contraseña actual</label><input type="password" required value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" /></div>
              <div><label className="text-xs text-slate-400 block mb-1">Nueva contraseña</label><input type="password" required value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" /></div>
              <div><label className="text-xs text-slate-400 block mb-1">Repetir nueva contraseña</label><input type="password" required value={repeatNewPassword} onChange={e => setRepeatNewPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" /></div>
              <button disabled={loading} className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-sm disabled:opacity-50">{loading ? 'Actualizando...' : 'Cambiar contraseña'}</button>
            </form>
          )}

          {section === 'notificaciones' && (
            <div className="space-y-3">
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                <div><p className="text-sm font-bold text-white">Notificaciones</p><p className="text-xs text-slate-400 mt-1">Recibir avisos de movimientos y proyectos.</p></div>
                <button onClick={() => toggleNotifications(!notifications)} className={`w-12 h-7 rounded-full p-1 transition ${notifications ? 'bg-blue-600' : 'bg-slate-700'}`}><span className={`block w-5 h-5 rounded-full bg-white transition ${notifications ? 'translate-x-5' : ''}`}></span></button>
              </div>
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
                <label className="text-sm font-bold text-white block mb-2">Tono de notificación</label>
                <div className="flex gap-2"><select value={ringtone} onChange={e => changeRingtone(e.target.value)} disabled={!notifications} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm"><option value="classic">Clásico</option><option value="soft">Suave</option><option value="digital">Digital</option></select><button onClick={playRingtone} disabled={!notifications} className="px-4 rounded-xl bg-blue-950 text-blue-400 border border-blue-800 disabled:opacity-40">▶</button></div>
              </div>
            </div>
          )}

          {section === 'administracion' && canAccessAdministration && (
            <div className="space-y-4">
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-11 h-11 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-lg">⚙️</div>
                  <div>
                    <p className="text-sm font-bold text-white">Información de la cuenta</p>
                    <p className="text-xs text-slate-400">Datos generales de tu cuenta y permisos.</p>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-3"><p className="text-[11px] text-slate-500">Nombre</p><p className="text-xs font-bold text-white mt-1">{userFullNameSafe(profile, user)}</p></div>
                  <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-3"><p className="text-[11px] text-slate-500">Rol</p><p className="text-xs font-bold text-blue-400 mt-1">{roleLabel}</p></div>
                  <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-3"><p className="text-[11px] text-slate-500">Correo</p><p className="text-xs font-bold text-white mt-1 truncate">{user.email}</p></div>
                  <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-3"><p className="text-[11px] text-slate-500">Usuarios registrados</p><p className="text-xs font-bold text-white mt-1">{adminLoading ? '...' : adminUsers.length}</p></div>
                </div>
                <div className="mt-3 bg-blue-950/30 border border-blue-900/50 rounded-xl p-3">
                  <p className="text-[11px] text-slate-500">Última actualización del panel</p>
                  <p className="text-xs font-semibold text-blue-300 mt-1">{adminLastUpdate ? adminLastUpdate.toLocaleString('es-AR') : 'Cargando...'}</p>
                </div>
              </div>

              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                <div className="flex items-center justify-between mb-3">
                  <div><p className="text-sm font-bold text-white">Usuarios registrados</p><p className="text-xs text-slate-400">Todos los perfiles registrados en WeBlock.</p></div>
                  <button onClick={loadAdministration} className="w-9 h-9 rounded-xl bg-blue-950/80 border border-blue-800/50 text-blue-400 flex items-center justify-center" title="Actualizar">↻</button>
                </div>
                {adminLoading ? <div className="text-center text-slate-500 text-xs py-8">Cargando usuarios...</div> :
                 adminUsers.length === 0 ? <div className="text-center text-slate-500 text-xs py-8">No hay usuarios registrados.</div> :
                 <div className="space-y-2 max-h-[420px] overflow-y-auto">
                   {adminUsers.map(u => {
                     const uRole = String(u?.Role || u?.role || 'cliente').toLowerCase();
                     const uRoleLabel = uRole === 'dueño' || uRole === 'owner' ? 'Dueño' : uRole === 'admin' ? 'Administrador' : 'Cliente';
                     const uName = `${u?.nombre || ''} ${u?.apellido || ''}`.trim() || 'Sin nombre';
                     const uUpdated = u?.updated_at || u?.created_at;
                     return (
                       <div key={u.id} className="bg-slate-950/70 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-3">
                         <div className="flex items-center gap-3 min-w-0">
                           <div className="w-10 h-10 rounded-full bg-blue-950 border border-blue-800/60 flex items-center justify-center text-blue-400 shrink-0">👤</div>
                           <div className="min-w-0"><p className="text-xs font-bold text-white truncate">{uName}</p><p className="text-[11px] text-slate-500 truncate">{u.email || 'Sin correo'}</p><p className="text-[9px] text-slate-600 mt-0.5">{uUpdated ? `Actualizado: ${new Date(uUpdated).toLocaleDateString('es-AR')}` : 'Sin fecha de actualización'}</p></div>
                         </div>
                         <span className={`text-[9px] font-bold px-2 py-1 rounded-full shrink-0 ${uRoleLabel === 'Dueño' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : uRoleLabel === 'Administrador' ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700'}`}>{uRoleLabel}</span>
                       </div>
                     );
                   })}
                 </div>}
              </div>

              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                <p className="text-sm font-bold text-white">Permisos de administración</p>
                <p className="text-xs text-slate-400 mt-1 mb-3">El rol define qué funciones puede utilizar cada cuenta.</p>
                <div className="space-y-2">
                  <div className="flex items-center justify-between bg-slate-950/60 rounded-xl px-3 py-2.5"><span className="text-xs text-slate-300">Dueño</span><span className="text-[9px] text-emerald-400 font-bold">ACCESO TOTAL</span></div>
                  <div className="flex items-center justify-between bg-slate-950/60 rounded-xl px-3 py-2.5"><span className="text-xs text-slate-300">Administrador</span><span className="text-[9px] text-blue-400 font-bold">ADMINISTRACIÓN</span></div>
                  <div className="flex items-center justify-between bg-slate-950/60 rounded-xl px-3 py-2.5"><span className="text-xs text-slate-300">Cliente</span><span className="text-[11px] text-slate-500 font-bold">SIN ACCESO</span></div>
                </div>
              </div>
            </div>
          )}

          {section === 'documentos' && (
            <div className="space-y-3">
              {canManageDocuments && (
                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-4">
                  <div className="flex items-center justify-between">
                    <div><p className="text-sm font-bold text-white">Subir documento</p><p className="text-xs text-slate-400">PDF, Word y otros archivos.</p></div>
                    <span className="text-blue-400">↑</span>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Quién puede verlo</label>
                    <select value={visibility} onChange={e => { setVisibility(e.target.value); setSelectedUserIds([]); }} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-xs">
                      <option value="all">Todos los usuarios</option>
                      <option value="admins">Solo dueño y administradores</option>
                      <option value="specific">Usuarios específicos</option>
                    </select>
                  </div>
                  {visibility === 'specific' && (
                    <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-3">
                      <p className="text-[11px] font-bold text-white mb-2">Elegí quiénes pueden verlo</p>
                      {loadingUsers ? <p className="text-[11px] text-slate-500">Cargando usuarios...</p> :
                       users.length === 0 ? <p className="text-[11px] text-slate-500">No hay usuarios disponibles.</p> :
                       <div className="space-y-2 max-h-48 overflow-y-auto">
                         {users.map(u => (
                           <label key={u.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-900 cursor-pointer">
                             <input type="checkbox" checked={selectedUserIds.includes(u.id)} onChange={() => toggleUser(u.id)} className="accent-blue-600" />
                             <div className="min-w-0">
                               <p className="text-xs text-white truncate">{u.nombre || u.apellido ? `${u.nombre || ''} ${u.apellido || ''}`.trim() : 'Sin nombre'}</p>
                               <p className="text-[11px] text-slate-500 truncate">{u.email}</p>
                             </div>
                           </label>
                         ))}
                       </div>}
                    </div>
                  )}
                  <label className={`w-full block text-center px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold cursor-pointer ${uploading ? 'opacity-50 pointer-events-none' : ''}`}>
                    {uploading ? 'Subiendo...' : 'Elegir archivo'}
                    <input type="file" onChange={uploadDocument} disabled={uploading} className="hidden" />
                  </label>
                </div>
              )}

              {documentsLoading ? <div className="text-center text-slate-500 text-xs py-8">Cargando documentos...</div> :
               documents.length === 0 ? <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-xs">Todavía no hay documentos disponibles.</div> :
               documents.map(doc => (
                 <div key={doc.id} onClick={() => openDocument(doc)} className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex items-center justify-between text-left hover:bg-slate-800/60 transition cursor-pointer">
                   <div className="flex items-center gap-3 min-w-0">
                     <div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 shrink-0">📄</div>
                     <div className="min-w-0"><p className="text-xs font-bold text-white truncate max-w-[210px]">{doc.name}</p>
                       <p className="text-[11px] text-slate-500">{doc.visibility === 'all' ? 'Visible para todos' : doc.visibility === 'admins' ? 'Solo dueño/admin' : 'Usuarios seleccionados'} · {new Date(doc.created_at).toLocaleDateString('es-AR')}</p>
                     </div>
                   </div>
                   <div className="flex items-center gap-2 shrink-0">
                     {canManageDocuments && <button type="button" title="Eliminar documento" onClick={(e) => { e.stopPropagation(); deleteDocument(doc); }} className="w-8 h-8 rounded-full bg-red-950/60 border border-red-900/60 text-red-400 hover:bg-red-900/70 flex items-center justify-center text-lg font-bold">×</button>}

                            <p className="text-sm text-slate-300 mt-1">{project.developer} · {project.location}</p>
                            <div className="grid grid-cols-3 gap-2 mt-5 pt-4 border-t border-white/10">
                              <div><p className="text-xs text-slate-400">Unidades</p><p className="text-sm font-bold text-white mt-1">{project.units}</p></div>
                              <div><p className="text-xs text-slate-400">Participación</p><p className="text-sm font-bold text-white mt-1">{project.participation}</p></div>
                              <div><p className="text-xs text-slate-400">Rendimiento</p><p className="text-sm font-bold text-emerald-400 mt-1">{project.yield}</p></div>
                            </div>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* ==================== VISTA: MOVIMIENTOS ==================== */}
                {activeTab === 'movimientos' && (
                  <div className="space-y-5 animate-fadeIn">
                    <div className="flex justify-between items-center">
                      <div>
                        <h1 className="text-4xl font-extrabold text-white">Movimientos</h1>
                        <p className="text-xs text-slate-400 mt-1">Historial de transacciones y eventos</p>
                      </div>
                      <button className="w-10 h-10 rounded-full bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-lg font-bold">
                        ≡
                      </button>
                    </div>

                    {/* Resumen Total Invertido y Cobrado */}
                    <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 grid grid-cols-2 gap-4">
                      <div>
                        <p className="text-xs text-slate-400 font-medium">Total invertido</p>
                        <p className="text-xl md:text-2xl font-extrabold text-white">$120.250.000</p>
                        <p className="text-[10px] text-blue-400 mt-1">↑ +8,4% vs. mes anterior</p>
                      </div>
                      <div>
                        <p className="text-xs text-slate-400 font-medium">Total cobrado</p>
                        <p className="text-xl md:text-2xl font-extrabold text-emerald-400">$28.450.000</p>
                        <p className="text-[10px] text-emerald-400 mt-1">↑ +12,7% vs. mes anterior</p>
                      </div>
                    </div>

                    {/* Filtros horizontales */}
                    <div className="flex items-center gap-2 overflow-x-auto pb-1">
                      {['Todos', 'Inversiones', 'Cobros', 'Distribuciones', 'Otros'].map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setMovFilter(cat)}
                          className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${movFilter === cat ? 'bg-blue-600 text-white' : 'bg-slate-900/80 text-slate-400 hover:bg-slate-800'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    {/* Sección Hoy */}
                    <div className="space-y-2">
                      <p className="text-xs font-bold text-slate-300">Hoy</p>
                      
                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-lg">
                            ↓
                          </div>
                          <div>
                            <p className="text-xs font-bold text-white">Cobro de rentabilidad</p>
                            <p className="text-xs text-slate-400">Torre Norte</p>
                            <p className="text-[11px] text-slate-500">Hoy, 14:32</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="text-right">
                            <p className="text-xs font-bold text-emerald-400">+$2.350.000</p>
                            <p className="text-[9px] text-slate-400">A tu cuenta</p>
                          </div>
                          <span className="text-slate-400 text-sm">›</span>
                        </div>
                      </div>

                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-lg">
                            ↑
                          </div>
                          <div>
                            <p className="text-xs font-bold text-white">Inversión realizada</p>
                            <p className="text-xs text-slate-400">Distrito Verde</p>
                            <p className="text-[11px] text-slate-500">Hoy, 11:08</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="text-right">
                            <p className="text-xs font-bold text-white">-$5.000.000</p>
                            <p className="text-[9px] text-slate-400">Desde tu cuenta</p>
                          </div>
                          <span className="text-slate-400 text-sm">›</span>
                        </div>
                      </div>

                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-purple-950/80 border border-purple-800/50 flex items-center justify-center text-purple-400 text-lg">
                            📄
                          </div>
                          <div>
                            <p className="text-xs font-bold text-white">Distribución de excedentes</p>
                            <p className="text-xs text-slate-400">Altos del Sur</p>
                            <p className="text-[11px] text-slate-500">Hoy, 09:15</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="text-right">
                            <p className="text-xs font-bold text-emerald-400">+$1.850.000</p>
                            <p className="text-[9px] text-slate-400">A tu cuenta</p>
                          </div>
                          <span className="text-slate-400 text-sm">›</span>
                        </div>
                      </div>
                    </div>

                    {/* Sección Ayer */}
                    <div className="space-y-2 pt-2">
                      <p className="text-xs font-bold text-slate-300">Ayer</p>

                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-lg">
                            ↓
                          </div>
                          <div>
                            <p className="text-xs font-bold text-white">Cobro de alquiler</p>
                            <p className="text-xs text-slate-400">Costanera View</p>
                            <p className="text-[11px] text-slate-500">Ayer, 16:45</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="text-right">
                            <p className="text-xs font-bold text-emerald-400">+$1.200.000</p>
                            <p className="text-[9px] text-slate-400">A tu cuenta</p>
                          </div>
                          <span className="text-slate-400 text-sm">›</span>
                        </div>
                      </div>

                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-lg">
                            ↑
                          </div>
                          <div>
                            <p className="text-xs font-bold text-white">Inversión realizada</p>
                            <p className="text-xs text-slate-400">Torre Norte</p>
                            <p className="text-[11px] text-slate-500">Ayer, 10:22</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="text-right">
                            <p className="text-xs font-bold text-white">-$10.000.000</p>
                            <p className="text-[9px] text-slate-400">Desde tu cuenta</p>
                          </div>
                          <span className="text-slate-400 text-sm">›</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* ==================== VISTA: PERFIL ==================== */}
                {activeTab === 'perfil' && (
                  profileSection ? (
                    <ProfileSection section={profileSection} user={user} profile={profile} onBack={() => setProfileSection(null)} />
                  ) : (
                    <div className="space-y-5 animate-fadeIn">
                      <div className="flex justify-between items-center">
                        <div><h1 className="text-4xl font-extrabold text-white">Perfil</h1><p className="text-xs text-slate-400 mt-1">Gestioná tu cuenta y preferencias</p></div>
                        <button onClick={() => setProfileSection('notificaciones')} className="w-10 h-10 rounded-full bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-lg font-bold">🔔</button>
                      </div>

                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-4"><div className="w-16 h-16 rounded-full bg-blue-950 border-2 border-blue-500 flex items-center justify-center text-2xl">👤</div><div><h2 className="text-xl font-bold text-white">{userFullName}</h2><p className="text-xs text-slate-400">{user.email}</p><div className="flex items-center gap-1 mt-1 text-blue-400 text-xs font-semibold"><span>✓ Cuenta verificada</span><span className="text-slate-500">· {roleLabel}</span></div></div></div>
                        </div>
                        <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-800"><div><p className="text-xs text-slate-400">Patrimonio total</p><p className="text-base font-bold text-white">$245.300.000</p></div><div><p className="text-xs text-slate-400">Inversiones activas</p><p className="text-base font-bold text-white">8</p></div></div>
                      </div>

                      <div className="space-y-2">
                        {[
                          { id: 'informacion', title: 'Información personal', sub: 'Nombre, apellido, teléfono y tipo de cuenta', icon: '👤' },
                          { id: 'seguridad', title: 'Seguridad', sub: 'Cambiar contraseña de acceso', icon: '🛡️' },
                          { id: 'notificaciones', title: 'Notificaciones', sub: 'Activar, desactivar y elegir tono', icon: '🔔' },
                          { id: 'documentos', title: 'Documentos', sub: 'Contratos, informes y comprobantes', icon: '📄' },
                          ...(canAccessAdministration ? [{ id: 'administracion', title: 'Administración', sub: 'Usuarios, roles y estado de la cuenta', icon: '⚙️' }] : []),
                          { id: 'soporte', title: 'Ayuda y soporte', sub: 'Contactá al soporte por WhatsApp', icon: '❓' }
                        ].map(item => (
                          <button key={item.id} onClick={() => setProfileSection(item.id)} className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between text-left hover:bg-slate-800/60 transition">
                            <div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-base">{item.icon}</div><div><p className="text-xs font-bold text-white">{item.title}</p><p className="text-xs text-slate-400">{item.sub}</p></div></div><span className="text-slate-400 text-base">›</span>
                          </button>
                        ))}
                        <div onClick={() => supabase.auth.signOut()} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between cursor-pointer hover:bg-red-950/30 transition"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-red-950/80 border border-red-800/50 flex items-center justify-center text-red-400 text-base">🚪</div><div><p className="text-xs font-bold text-white">Cerrar sesión</p><p className="text-xs text-slate-400">Salir de tu cuenta de WeBlock</p></div></div><span className="text-slate-400 text-base">›</span></div>
                      </div>

                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-lg">🎧</div><div><p className="text-xs font-bold text-white">¿Necesitás ayuda?</p><p className="text-xs text-slate-400">Nuestro equipo está disponible<br/>de Lunes a Viernes de 9 a 18 hs.</p></div></div><button onClick={() => setProfileSection('soporte')} className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-600/30">Contactar soporte</button></div>
                    </div>
                  )
                )}
              </>
            )}
          </main>

          {/* BOTONERA INFERIOR (MÓVIL) FIEL A LAS IMÁGENES */}
          <div className="md:hidden fixed bottom-0 inset-x-0 bg-[#020510]/95 backdrop-blur-md border-t border-slate-800/80 py-2.5 px-6 flex justify-around items-center z-50">
            {[
              { id: 'inicio', label: 'Inicio', icon: IconInicio },
              { id: 'proyectos', label: 'Proyectos', icon: IconProyectos },
              { id: 'movimientos', label: 'Movimientos', icon: IconMovimientos },
              { id: 'perfil', label: 'Perfil', icon: IconPerfil },
            ].map(tab => {
              const Icon = tab.icon;
              const isActive = activeTab === tab.id && !selectedProject;
              return (
                <button 
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); setSelectedProject(null); }}
                  className="flex flex-col items-center gap-1 relative"
                >
                  <Icon active={isActive} />
                  <span className={`text-[10px] ${isActive ? 'text-blue-500 font-bold' : 'text-slate-500'}`}>{tab.label}</span>
                  {isActive && <div className="w-5 h-0.5 bg-blue-500 rounded-full mt-0.5"></div>}
                </button>
              );
            })}
          </div>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
