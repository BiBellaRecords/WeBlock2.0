<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>WeBlock - Inversiones Inmobiliarias</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #030816;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-serif-title { font-family: 'Playfair Display', serif; }

    /* ESTILOS DE TARJETAS APILADAS (PROYECTOS) EXACTOS A LA FOTO */
    .stacked-container {
      display: flex;
      flex-direction: column;
      padding-bottom: 30px;
    }

    .stacked-card {
      margin-bottom: -135px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      cursor: pointer;
    }

    .stacked-card:last-child {
      margin-bottom: 0;
    }

    .stacked-card:hover {
      transform: translateY(-12px);
      z-index: 50 !important;
    }

    /* COLORES Y FONDOS CON DEGRADADO + IMAGEN FOTOGRÁFICA */
    .card-blue {
      background: linear-gradient(135deg, rgba(6, 26, 68, 0.94) 0%, rgba(3, 12, 34, 0.98) 100%), 
                  url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(37, 99, 235, 0.5);
      box-shadow: 0 15px 35px -5px rgba(29, 78, 216, 0.4);
    }

    .card-green {
      background: linear-gradient(135deg, rgba(4, 38, 24, 0.92) 0%, rgba(2, 18, 11, 0.96) 100%), 
                  url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 15px 35px -5px rgba(16, 185, 129, 0.25);
    }

    .card-amber {
      background: linear-gradient(135deg, rgba(45, 28, 4, 0.92) 0%, rgba(18, 11, 2, 0.96) 100%), 
                  url('https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(217, 119, 6, 0.4);
      box-shadow: 0 15px 35px -5px rgba(217, 119, 6, 0.25);
    }

    .card-purple {
      background: linear-gradient(135deg, rgba(30, 14, 52, 0.92) 0%, rgba(13, 4, 23, 0.96) 100%), 
                  url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 15px 35px -5px rgba(139, 92, 246, 0.25);
    }

    .glass-box {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }


    /* =========================================================
       WEBLOCK - INICIO RESPONSIVE
       Desktop: dashboard amplio como la referencia.
       Mobile: layout compacto tipo app.
       ========================================================= */

    .weblock-logo-crop {
      width: 200px;
      height: 100px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .weblock-logo-image {
      width: 188px;
      height: auto;
      max-width: none;
      display: block;
      transform: scale(1.04);
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 10px rgba(37,99,235,.20));
    }

    .weblock-logo-large {
      width: 220px;
      height: 64px;
    }

    .weblock-logo-large .weblock-logo-image {
      width: 245px;
    }

    .home-dashboard {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .home-hero {
      min-height: 360px;
    }

    .home-patrimony {
      margin-top: -1px;
    }

    .home-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .home-stat-card {
      min-width: 0;
      min-height: 150px;
    }

    @media (max-width: 767px) {
      .weblock-logo-crop {
        width: 158px;
        height: 48px;
      }

      .weblock-logo-image {
        width: 175px;
      }

      .weblock-logo-large {
        width: 190px;
        height: 56px;
      }

      .weblock-logo-large .weblock-logo-image {
        width: 215px;
      }

      .home-dashboard {
        max-width: none;
      }

      .home-hero {
        min-height: 330px;
      }

      .home-stats-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .home-stat-card {
        min-height: auto;
      }
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-full bg-[#030816] text-white">

  <div id="root" class="w-full h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONFIGURACIÓN SUPABASE ---
    const SUPABASE_URL = "https://jyqavprfowwhzjfcwlsh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WIxlCKHdUlFBJM--qnpQ0w_VlU_CM3i";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // LOGO WEBLOCK: LogoWeBlock.png
    // El blend "screen" hace que el fondo negro del PNG se camufle con el fondo de la web.
    const WeBlockLogo = ({ large = false }) => (
      <div className={`weblock-logo-crop ${large ? 'weblock-logo-large' : ''}`}>
        <img
          src="./Logo2.png"
          alt="WeBlock"
          className="weblock-logo-image"
        />
      </div>
    );

    // ICONOS DE LA BARRA INFERIOR Y SECCIONES
    const IconInicio = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    );

    const IconProyectos = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4M9 7h1m-1 4h1m4-4h1m-1 4h1" />
      </svg>
    );

    const IconMovimientos = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m-8 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconPerfil = ({ active }) => (
      <svg className={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    );

    // --- COMPONENTE DE AUTENTICACIÓN COMPLETO ---
    const AuthScreen = ({ onAuthSuccess }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [nombre, setNombre] = useState('');
      const [apellido, setApellido] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [repeatPassword, setRepeatPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        const savedEmail = localStorage.getItem('weblock_remember_email');
        const savedPassword = localStorage.getItem('weblock_remember_password');
        if (savedEmail && savedPassword) {
          setEmail(savedEmail);
          setPassword(savedPassword);
          setRememberMe(true);
        }
      }, []);

      const getPasswordStrength = (pass) => {
        if (!pass) return { score: 0, label: '', color: 'bg-slate-800' };
        let score = 0;
        if (pass.length > 0) score += 1;
        if (pass.length >= 6) score += 1;
        if (/[0-9]/.test(pass)) score += 1;
        if (/[@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass)) score += 1;

        if (pass.length <= 5 && score <= 2) {
          return { score: 25, label: 'Débil', color: 'bg-red-500', textColor: 'text-red-400' };
        } else if (score === 2 || score === 3) {
          return { score: 50, label: 'Media', color: 'bg-amber-500', textColor: 'text-amber-400' };
        } else if (score === 4 && pass.length >= 8) {
          return { score: 100, label: 'Muy Fuerte', color: 'bg-emerald-400', textColor: 'text-emerald-300' };
        } else {
          return { score: 75, label: 'Fuerte', color: 'bg-emerald-500', textColor: 'text-emerald-400' };
        }
      };

      const strength = getPasswordStrength(password);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (rememberMe) {
          localStorage.setItem('weblock_remember_email', email);
          localStorage.setItem('weblock_remember_password', password);
        } else {
          localStorage.removeItem('weblock_remember_email');
          localStorage.removeItem('weblock_remember_password');
        }

        if (!isLogin) {
          if (password !== repeatPassword) {
            setErrorMsg('Las contraseñas no coinciden');
            return;
          }
          if (password.length < 6) {
            setErrorMsg('La contraseña debe tener al menos 6 caracteres');
            return;
          }
        }

        try {
          if (isLogin) {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            onAuthSuccess(data.user);
          } else {
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: { 
                data: { 
                  full_name: `${nombre} ${apellido}`.trim(),
                  first_name: nombre,
                  last_name: apellido,
                } 
              }
            });
            if (error) throw error;
            onAuthSuccess(data.user);
          }
        } catch (err) {
          setErrorMsg(err.message || 'Error al iniciar sesión');
        }
      };

      return (
        <div className="fixed inset-0 bg-[#030816] z-50 flex flex-col justify-center px-6 overflow-y-auto py-8">
          <div className="flex flex-col items-center mb-6">
            <WeBlockLogo />
            <h1 className="text-3xl font-bold tracking-tight mt-2">We<span className="text-blue-500">Block</span></h1>
            <p className="text-xs text-slate-400 mt-1">{isLogin ? 'Ingresá a tu cuenta' : 'Creá tu cuenta de inversor'}</p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-3.5 max-w-sm mx-auto w-full">
            
            {!isLogin && (
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Nombre</label>
                  <input 
                    type="text" 
                    value={nombre} 
                    onChange={(e) => setNombre(e.target.value)} 
                    required
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                    placeholder="Ej: Axel"
                  />
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Apellido</label>
                  <input 
                    type="text" 
                    value={apellido} 
                    onChange={(e) => setApellido(e.target.value)} 
                    required
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                    placeholder="Ej: DiBella"
                  />
                </div>
              </div>
            )}

            <div>
              <label className="text-[11px] text-slate-400 block mb-1">Mail</label>
              <input 
                type="email" 
                value={email} 
                onChange={(e) => setEmail(e.target.value)} 
                required
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                placeholder="tu@email.com"
              />
            </div>

            <div>
              <label className="text-[11px] text-slate-400 block mb-1">Contraseña</label>
              <input 
                type="password" 
                value={password} 
                onChange={(e) => setPassword(e.target.value)} 
                required
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none"
                placeholder="••••••••"
              />
              
              {!isLogin && password.length > 0 && (
                <div className="mt-2 space-y-1">
                  <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                    <div className={`h-full transition-all duration-300 ${strength.color}`} style={{ width: `${strength.score}%` }}></div>
                  </div>
                  <div className="flex justify-between items-center text-[10px]">
                    <span className="text-slate-500">Seguridad: <strong className={strength.textColor}>{strength.label}</strong></span>
                    <span className="text-slate-500 font-mono">+6 letras y números</span>
                  </div>
                </div>
              )}
            </div>

            {!isLogin && (
              <div>
                <label className="text-[11px] text-slate-400 block mb-1">Repetir contraseña</label>
                <input 
                  type="password" 
                  value={repeatPassword} 
                  onChange={(e) => setRepeatPassword(e.target.value)} 
                  required
                  className={`w-full bg-slate-900 border rounded-xl px-3.5 py-2.5 text-sm outline-none ${
                    repeatPassword && password !== repeatPassword ? 'border-red-500' : 'border-slate-800 focus:border-blue-500'
                  }`}
                  placeholder="••••••••"
                />
              </div>
            )}

            <div className="flex items-center justify-between pt-1">
              <label className="flex items-center gap-2 cursor-pointer select-none">
                <input 
                  type="checkbox" 
                  checked={rememberMe} 
                  onChange={(e) => setRememberMe(e.target.checked)}
                  className="w-4 h-4 rounded bg-slate-900 border-slate-800 text-blue-600 focus:ring-0 cursor-pointer accent-blue-600"
                />
                <span className="text-xs text-slate-400">Recordarme</span>
              </label>
              {isLogin && <a href="#" className="text-[11px] text-blue-400 hover:underline">¿Olvidaste tu clave?</a>}
            </div>

            {errorMsg && <p className="text-xs text-red-400 text-center py-1">{errorMsg}</p>}

            <button type="submit" className="w-full py-3.5 rounded-xl bg-blue-600 font-bold text-sm hover:bg-blue-500 transition shadow-lg shadow-blue-600/30">
              {isLogin ? 'Iniciar Sesión' : 'Registrarse'}
            </button>

            <p className="text-xs text-center text-slate-400 mt-4 cursor-pointer" onClick={() => { setIsLogin(!isLogin); setErrorMsg(''); }}>
              {isLogin ? '¿No tenés cuenta? Registrate aquí' : '¿Ya tenés cuenta? Iniciá sesión'}
            </p>
          </form>
        </div>
      );
    };


    // ==================== PERFIL: SECCIONES FUNCIONALES ====================
    const ProfileSection = ({ section, user, profile, onBack }) => {
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState('');
      const [error, setError] = useState('');

      const rawRole = profile?.Role || profile?.role || 'cliente';
      const normalizedRole = String(rawRole).toLowerCase();
      const canManageDocuments = ['admin', 'dueño', 'owner'].includes(normalizedRole);

      const [firstName, setFirstName] = useState(profile?.nombre || user?.user_metadata?.first_name || '');
      const [lastName, setLastName] = useState(profile?.apellido || user?.user_metadata?.last_name || '');
      const [phone, setPhone] = useState(profile?.telefono || user?.user_metadata?.phone || '');

      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [repeatNewPassword, setRepeatNewPassword] = useState('');
      const [notifications, setNotifications] = useState(() => localStorage.getItem('weblock_notifications') !== 'false');
      const [ringtone, setRingtone] = useState(() => localStorage.getItem('weblock_ringtone') || 'classic');

      const [documents, setDocuments] = useState([]);
      const [documentsLoading, setDocumentsLoading] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [visibility, setVisibility] = useState('all');
      const [users, setUsers] = useState([]);
      const [selectedUserIds, setSelectedUserIds] = useState([]);
      const [loadingUsers, setLoadingUsers] = useState(false);

      useEffect(() => {
        if (section === 'documentos') {
          loadDocuments();
          if (canManageDocuments) loadUsers();
        }
      }, [section, canManageDocuments]);

      const loadDocuments = async () => {
        setDocumentsLoading(true);
        setError('');
        const { data, error } = await supabase.from('documents').select('*').order('created_at', { ascending: false });
        if (error) {
          setError('No se pudieron cargar los documentos: ' + error.message);
          setDocuments([]);
        } else setDocuments(data || []);
        setDocumentsLoading(false);
      };

      const loadUsers = async () => {
        setLoadingUsers(true);
        const { data, error } = await supabase
          .from('profiles')
          .select('id,email,nombre,apellido,"Role"')
          .order('email', { ascending: true });

        if (error) {
          setUsers([]);
          setError('No se pudieron cargar los usuarios. Hay que agregar una policy para que Admin/Dueño puedan ver la lista.');
        } else {
          setUsers((data || []).filter(u => u.id !== user.id));
        }
        setLoadingUsers(false);
      };

      const savePersonalInfo = async (e) => {
        e.preventDefault();
        setLoading(true); setError(''); setMessage('');

        const { error: profileError } = await supabase.from('profiles').update({
          nombre: firstName,
          apellido: lastName,
          telefono: phone
        }).eq('id', user.id);

        if (profileError) {
          setLoading(false);
          setError(profileError.message);
          return;
        }

        const { error: authError } = await supabase.auth.updateUser({
          data: { first_name: firstName, last_name: lastName, full_name: `${firstName} ${lastName}`.trim(), phone }
        });

        setLoading(false);
        if (authError) setError(authError.message);
        else setMessage('Información actualizada correctamente.');
      };

      const changePassword = async (e) => {
        e.preventDefault();
        setLoading(true); setError(''); setMessage('');
        if (newPassword.length < 6) { setLoading(false); setError('La nueva contraseña debe tener al menos 6 caracteres.'); return; }
        if (newPassword !== repeatNewPassword) { setLoading(false); setError('Las nuevas contraseñas no coinciden.'); return; }

        const { error: loginError } = await supabase.auth.signInWithPassword({ email: user.email, password: currentPassword });
        if (loginError) { setLoading(false); setError('La contraseña actual es incorrecta.'); return; }

        const { error } = await supabase.auth.updateUser({ password: newPassword });
        setLoading(false);
        if (error) setError(error.message);
        else {
          setMessage('Contraseña actualizada correctamente.');
          setCurrentPassword(''); setNewPassword(''); setRepeatNewPassword('');
        }
      };

      const toggleNotifications = (value) => {
        setNotifications(value);
        localStorage.setItem('weblock_notifications', String(value));
      };

      const changeRingtone = (value) => {
        setRingtone(value);
        localStorage.setItem('weblock_ringtone', value);
      };

      const playRingtone = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const frequencies = { classic: 880, soft: 660, digital: 1200 };
          osc.frequency.value = frequencies[ringtone] || 880;
          osc.type = ringtone === 'digital' ? 'square' : 'sine';
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.35);
        } catch (_) {}
      };

      const toggleUser = (id) => {
        setSelectedUserIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const uploadDocument = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !canManageDocuments) return;

        if (visibility === 'specific' && selectedUserIds.length === 0) {
          setError('Elegí al menos un usuario para este documento.');
          e.target.value = '';
          return;
        }

        setUploading(true); setError(''); setMessage('');

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const storagePath = `${user.id}/${Date.now()}_${safeName}`;

        const { error: uploadError } = await supabase.storage.from('documents').upload(storagePath, file, { upsert: false });
        if (uploadError) {
          setUploading(false); setError(uploadError.message); e.target.value = ''; return;
        }

        const { data: doc, error: dbError } = await supabase.from('documents').insert({
          name: file.name,
          storage_path: storagePath,
          uploaded_by: user.id,
          visibility: visibility === 'specific' ? 'specific' : visibility
        }).select().single();

        if (dbError) {
          await supabase.storage.from('documents').remove([storagePath]);
          setUploading(false); setError(dbError.message); e.target.value = ''; return;
        }

        if (visibility === 'specific') {
          const permissions = selectedUserIds.map(userId => ({ document_id: doc.id, user_id: userId }));
          const { error: permissionsError } = await supabase.from('document_permissions').insert(permissions);

          if (permissionsError) {
            await supabase.from('documents').delete().eq('id', doc.id);
            await supabase.storage.from('documents').remove([storagePath]);
            setUploading(false); setError(permissionsError.message); e.target.value = ''; return;
          }
        }

        setUploading(false);
        setMessage('Documento subido correctamente.');
        setSelectedUserIds([]);
        setVisibility('all');
        await loadDocuments();
        e.target.value = '';
      };

      const getStoragePath = (doc) => {
        let storagePath = String(doc?.storage_path || doc?.path || '').replace(/^\/+/, '');
        if (storagePath.startsWith('documents/')) storagePath = storagePath.slice('documents/'.length);
        return storagePath;
      };

      const openDocument = async (doc) => {
        setError('');
        const storagePath = getStoragePath(doc);
        if (!storagePath) { setError('Este documento no tiene una ruta válida.'); return; }

        const { data, error } = await supabase.storage.from('documents').createSignedUrl(storagePath, 300);
        if (error || !data?.signedUrl) {
          console.error('Error abriendo documento:', { doc, storagePath, error });
          setError('No se pudo abrir el documento. La ruta guardada no coincide con el archivo del bucket.');
          return;
        }
        window.open(data.signedUrl, '_blank', 'noopener,noreferrer');
      };

      const deleteDocument = async (doc) => {
        if (!canManageDocuments) return;
        if (!window.confirm(`¿Querés eliminar \"${doc.name}\"?`)) return;

        setError('');
        setMessage('');
        const storagePath = getStoragePath(doc);

        const { error: storageError } = await supabase.storage.from('documents').remove([storagePath]);
        if (storageError) {
          console.error(storageError);
          setError('No se pudo eliminar el archivo: ' + storageError.message);
          return;
        }

        const { error: dbError } = await supabase.from('documents').delete().eq('id', doc.id);
        if (dbError) {
          setError('El archivo se eliminó de Storage, pero no su registro: ' + dbError.message);
          await loadDocuments();
          return;
        }

        setMessage('Documento eliminado correctamente.');
        await loadDocuments();
      };

      const roleLabel = normalizedRole === 'dueño' || normalizedRole === 'owner' ? 'Dueño'
        : normalizedRole === 'admin' ? 'Administrador' : 'Cliente';

      const titleMap = {
        informacion: ['Información personal', 'Tus datos personales y de contacto'],
        seguridad: ['Seguridad', 'Cambiá tu contraseña de acceso'],
        notificaciones: ['Notificaciones', 'Configurá cómo querés recibir avisos'],
        documentos: ['Documentos', 'Contratos, informes y comprobantes']
      };

      useEffect(() => {
        if (section === 'soporte') {
          const supportNumber = '549XXXXXXXXXX';
          window.open(`https://wa.me/${supportNumber}?text=${encodeURIComponent('Hola, necesito ayuda con WeBlock.')}`, '_blank', 'noopener,noreferrer');
          onBack();
        }
      }, [section]);

      if (section === 'soporte') return null;
      const [title, subtitle] = titleMap[section] || ['', ''];

      return (
        <div className="space-y-5 animate-fadeIn pb-8">
          <div className="flex items-center gap-3">
            <button onClick={onBack} className="w-10 h-10 rounded-full bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-xl">‹</button>
            <div><h1 className="text-3xl font-extrabold text-white">{title}</h1><p className="text-xs text-slate-400 mt-1">{subtitle}</p></div>
          </div>

          {message && <div className="p-3 rounded-xl bg-emerald-950/50 border border-emerald-800/50 text-emerald-400 text-xs">✓ {message}</div>}
          {error && <div className="p-3 rounded-xl bg-red-950/50 border border-red-800/50 text-red-400 text-xs">{error}</div>}

          {section === 'informacion' && (
            <form onSubmit={savePersonalInfo} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
              {[
                ['Nombre', firstName, setFirstName, 'Ej: Axel'],
                ['Apellido', lastName, setLastName, 'Ej: DiBella'],
                ['Mail', user.email || '', () => {}, 'tu@email.com']
              ].map(([label, value, setter, placeholder]) => (
                <div key={label}>
                  <label className="text-[11px] text-slate-400 block mb-1">{label}</label>
                  <input value={value} onChange={e => setter(e.target.value)} disabled={label === 'Mail'} placeholder={placeholder} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500 disabled:opacity-60" />
                </div>
              ))}
              <div>
                <label className="text-[11px] text-slate-400 block mb-1">Número de teléfono</label>
                <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="Opcional" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" />
              </div>
              <div>
                <label className="text-[11px] text-slate-400 block mb-1">Qué sos</label>
                <select value={normalizedRole === 'dueño' || normalizedRole === 'owner' ? 'dueño' : normalizedRole === 'admin' ? 'admin' : 'cliente'} disabled className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none opacity-70">
                  <option value="cliente">Cliente</option><option value="admin">Administrador</option><option value="dueño">Dueño</option>
                </select>
                <p className="text-[9px] text-slate-500 mt-1">El rol lo administra WeBlock y no puede modificarse desde este perfil.</p>
              </div>
              <button disabled={loading} className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-sm disabled:opacity-50">{loading ? 'Guardando...' : 'Guardar cambios'}</button>
            </form>
          )}

          {section === 'seguridad' && (
            <form onSubmit={changePassword} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
              <div><label className="text-[11px] text-slate-400 block mb-1">Contraseña actual</label><input type="password" required value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" /></div>
              <div><label className="text-[11px] text-slate-400 block mb-1">Nueva contraseña</label><input type="password" required value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" /></div>
              <div><label className="text-[11px] text-slate-400 block mb-1">Repetir nueva contraseña</label><input type="password" required value={repeatNewPassword} onChange={e => setRepeatNewPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none focus:border-blue-500" /></div>
              <button disabled={loading} className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-sm disabled:opacity-50">{loading ? 'Actualizando...' : 'Cambiar contraseña'}</button>
            </form>
          )}

          {section === 'notificaciones' && (
            <div className="space-y-3">
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                <div><p className="text-sm font-bold text-white">Notificaciones</p><p className="text-[10px] text-slate-400 mt-1">Recibir avisos de movimientos y proyectos.</p></div>
                <button onClick={() => toggleNotifications(!notifications)} className={`w-12 h-7 rounded-full p-1 transition ${notifications ? 'bg-blue-600' : 'bg-slate-700'}`}><span className={`block w-5 h-5 rounded-full bg-white transition ${notifications ? 'translate-x-5' : ''}`}></span></button>
              </div>
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
                <label className="text-sm font-bold text-white block mb-2">Tono de notificación</label>
                <div className="flex gap-2"><select value={ringtone} onChange={e => changeRingtone(e.target.value)} disabled={!notifications} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm"><option value="classic">Clásico</option><option value="soft">Suave</option><option value="digital">Digital</option></select><button onClick={playRingtone} disabled={!notifications} className="px-4 rounded-xl bg-blue-950 text-blue-400 border border-blue-800 disabled:opacity-40">▶</button></div>
              </div>
            </div>
          )}

          {section === 'documentos' && (
            <div className="space-y-3">
              {canManageDocuments && (
                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-4">
                  <div className="flex items-center justify-between">
                    <div><p className="text-sm font-bold text-white">Subir documento</p><p className="text-[10px] text-slate-400">PDF, Word y otros archivos.</p></div>
                    <span className="text-blue-400">↑</span>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Quién puede verlo</label>
                    <select value={visibility} onChange={e => { setVisibility(e.target.value); setSelectedUserIds([]); }} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-xs">
                      <option value="all">Todos los usuarios</option>
                      <option value="admins">Solo dueño y administradores</option>
                      <option value="specific">Usuarios específicos</option>
                    </select>
                  </div>
                  {visibility === 'specific' && (
                    <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-3">
                      <p className="text-[11px] font-bold text-white mb-2">Elegí quiénes pueden verlo</p>
                      {loadingUsers ? <p className="text-[10px] text-slate-500">Cargando usuarios...</p> :
                       users.length === 0 ? <p className="text-[10px] text-slate-500">No hay usuarios disponibles.</p> :
                       <div className="space-y-2 max-h-48 overflow-y-auto">
                         {users.map(u => (
                           <label key={u.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-900 cursor-pointer">
                             <input type="checkbox" checked={selectedUserIds.includes(u.id)} onChange={() => toggleUser(u.id)} className="accent-blue-600" />
                             <div className="min-w-0">
                               <p className="text-xs text-white truncate">{u.nombre || u.apellido ? `${u.nombre || ''} ${u.apellido || ''}`.trim() : 'Sin nombre'}</p>
                               <p className="text-[9px] text-slate-500 truncate">{u.email}</p>
                             </div>
                           </label>
                         ))}
                       </div>}
                    </div>
                  )}
                  <label className={`w-full block text-center px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold cursor-pointer ${uploading ? 'opacity-50 pointer-events-none' : ''}`}>
                    {uploading ? 'Subiendo...' : 'Elegir archivo'}
                    <input type="file" onChange={uploadDocument} disabled={uploading} className="hidden" />
                  </label>
                </div>
              )}

              {documentsLoading ? <div className="text-center text-slate-500 text-xs py-8">Cargando documentos...</div> :
               documents.length === 0 ? <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-xs">Todavía no hay documentos disponibles.</div> :
               documents.map(doc => (
                 <div key={doc.id} onClick={() => openDocument(doc)} className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex items-center justify-between text-left hover:bg-slate-800/60 transition cursor-pointer">
                   <div className="flex items-center gap-3 min-w-0">
                     <div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 shrink-0">📄</div>
                     <div className="min-w-0"><p className="text-xs font-bold text-white truncate max-w-[210px]">{doc.name}</p>
                       <p className="text-[9px] text-slate-500">{doc.visibility === 'all' ? 'Visible para todos' : doc.visibility === 'admins' ? 'Solo dueño/admin' : 'Usuarios seleccionados'} · {new Date(doc.created_at).toLocaleDateString('es-AR')}</p>
                     </div>
                   </div>
                   <div className="flex items-center gap-2 shrink-0">
                     {canManageDocuments && <button type="button" title="Eliminar documento" onClick={(e) => { e.stopPropagation(); deleteDocument(doc); }} className="w-8 h-8 rounded-full bg-red-950/60 border border-red-900/60 text-red-400 hover:bg-red-900/70 flex items-center justify-center text-lg font-bold">×</button>}
                     <span className="text-slate-400">›</span>
                   </div>
                 </div>
               ))}
            </div>
          )}
        </div>
      );
    };

    // --- APP PRINCIPAL COMPLETA ---
    const App = () => {
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [activeTab, setActiveTab] = useState('inicio');
      const [selectedProject, setSelectedProject] = useState(null);
      const [movFilter, setMovFilter] = useState('Todos');
      const [profileSection, setProfileSection] = useState(null);

      const loadProfile = async (currentUser) => {
        if (!currentUser) { setProfile(null); return; }
        const { data, error } = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
        if (error) console.error('Error cargando perfil:', error);
        setProfile(data || null);
      };

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          loadProfile(currentUser);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          loadProfile(currentUser);
        });

        return () => subscription.unsubscribe();
      }, []);

      if (!user) {
        return <AuthScreen onAuthSuccess={(u) => setUser(u)} />;
      }

      const userName = profile?.nombre || user.user_metadata?.first_name || 'Usuario';
      const userFullName = `${profile?.nombre || user.user_metadata?.first_name || ''} ${profile?.apellido || user.user_metadata?.last_name || ''}`.trim() || 'Usuario';
      const rawRole = profile?.Role || profile?.role || 'cliente';
      const normalizedRole = String(rawRole).toLowerCase();
      const roleLabel = normalizedRole === 'dueño' || normalizedRole === 'owner' ? 'Dueño' : normalizedRole === 'admin' ? 'Administrador' : 'Cliente';

      return (
        <div className="w-full h-full flex flex-col md:flex-row bg-[#030816] overflow-hidden relative">
          
          {/* BARRA LATERAL (PC) */}
          <aside className="hidden md:flex flex-col w-[330px] border-r border-slate-800/70 px-8 py-9 space-y-10 bg-[#020510] shrink-0">
            <div className="flex items-center">
              <WeBlockLogo />
            </div>

            <nav className="flex flex-col space-y-2">
              {[
                { id: 'inicio', label: 'Inicio', icon: IconInicio },
                { id: 'proyectos', label: 'Proyectos', icon: IconProyectos },
                { id: 'movimientos', label: 'Movimientos', icon: IconMovimientos },
                { id: 'perfil', label: 'Perfil', icon: IconPerfil },
              ].map(item => {
                const Icon = item.icon;
                return (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setSelectedProject(null); }}
                    className={`flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition ${activeTab === item.id && !selectedProject ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800/50'}`}
                  >
                    <Icon active={activeTab === item.id && !selectedProject} />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main className={`flex-1 overflow-y-auto w-full max-w-none mx-auto p-4 md:p-8 lg:p-10 pb-28 ${selectedProject === 'Distrito Verde' ? 'bg-[#02120b]' : ''}`}>
            
            {/* LOGO DE MARCA SUPERIOR MÓVIL */}
            {!selectedProject && (
              <div className="flex items-center mb-3 md:hidden">
                <WeBlockLogo />
              </div>
            )}

            {/* ==================== VISTA DETALLE: DISTRITO VERDE ==================== */}
            {selectedProject === 'Distrito Verde' ? (
              <div className="space-y-5 animate-fadeIn">
                {/* Header superior */}
                <div className="flex justify-between items-center">
                  <button onClick={() => setSelectedProject(null)} className="w-10 h-10 rounded-full bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-xl font-bold">
                    ‹
                  </button>
                  <button className="w-10 h-10 rounded-full bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-sm">
                    •••
                  </button>
                </div>

                {/* Título & Badge */}
                <div>
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-semibold border border-emerald-500/30 mb-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> En preventa
                  </span>
                  <h1 className="text-4xl font-serif-title font-bold text-white">Distrito Verde</h1>
                  <p className="text-sm font-semibold text-slate-400 mt-1">Desarrolladora Urbana</p>
                  <p className="text-xs text-slate-400 mt-2 max-w-md">Un proyecto residencial sustentable en el corazón de la ciudad.</p>
                </div>

                {/* Tarjeta Tu inversión total */}
                <div className="bg-gradient-to-br from-emerald-950/90 via-emerald-950/40 to-slate-950 border border-emerald-800/60 rounded-2xl p-5 space-y-4 shadow-xl">
                  <div>
                    <p className="text-[11px] text-slate-300 font-medium mb-1">Tu inversión total</p>
                    <h2 className="text-3xl md:text-4xl font-extrabold text-white">$35.000.000</h2>
                  </div>

                  <div className="grid grid-cols-2 gap-4 text-xs pt-3 border-t border-emerald-800/40">
                    <div>
                      <p className="text-[10px] text-slate-400">Participación</p>
                      <p className="font-bold text-white text-sm">1,85%</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Tokens adquiridos</p>
                      <p className="font-bold text-white text-sm">35.000</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Rentabilidad anual estimada</p>
                      <p className="font-bold text-white text-sm">11,2%</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Rendimiento acumulado</p>
                      <p className="font-bold text-emerald-400 text-sm">+$2.450.000</p>
                      <p className="text-[9px] text-emerald-500/80">+7,0% sobre tu inversión</p>
                    </div>
                  </div>
                </div>

                {/* Próximo pago y Frecuencia */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-emerald-950/40 border border-emerald-800/40 rounded-2xl p-4 flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-900/50 flex items-center justify-center text-emerald-400 shrink-0">
                      📈
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Próximo pago estimado</p>
                      <p className="text-xs font-bold text-white">15 de Agosto 2024</p>
                      <p className="text-xs font-bold text-emerald-400">$1.250.000</p>
                    </div>
                  </div>

                  <div className="bg-emerald-950/40 border border-emerald-800/40 rounded-2xl p-4 flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-900/50 flex items-center justify-center text-emerald-400 shrink-0">
                      📅
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Frecuencia de pagos</p>
                      <p className="text-sm font-bold text-white">Trimestral</p>
                    </div>
                  </div>
                </div>

                {/* Avance de obra */}
                <div className="bg-emerald-950/40 border border-emerald-800/40 rounded-2xl p-4 flex justify-between items-center">
                  <div className="space-y-2 flex-1 pr-4">
                    <p className="text-xs text-slate-400">Avance de obra</p>
                    <p className="text-3xl font-extrabold text-white">38%</p>
                    <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                      <div className="bg-emerald-500 h-full w-[38%] rounded-full"></div>
                    </div>
                    <p className="text-[10px] text-slate-500">Última actualización: 12 May 2024</p>
                  </div>
                  <div className="w-24 h-20 rounded-xl overflow-hidden bg-slate-800 shrink-0 border border-emerald-700/30">
                    <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80" alt="Edificio" className="w-full h-full object-cover" />
                  </div>
                </div>

                {/* Documentos */}
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <p className="text-xs font-bold text-white">Documentos</p>
                    <a href="#" className="text-xs text-emerald-400 hover:underline">Ver todas ›</a>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { title: 'Fideicomiso', ext: 'PDF' },
                      { title: 'Contrato', ext: 'PDF' },
                      { title: 'Reporte mensual', ext: 'PDF' }
                    ].map((doc, idx) => (
                      <div key={idx} className="bg-emerald-950/40 border border-emerald-800/40 rounded-xl p-3 flex flex-col justify-between h-20">
                        <span className="text-emerald-400 text-lg">📄</span>
                        <div>
                          <p className="text-[11px] font-bold text-white truncate">{doc.title}</p>
                          <p className="text-[9px] text-slate-400">{doc.ext}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Noticias recientes */}
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <p className="text-xs font-bold text-white">Noticias recientes</p>
                    <a href="#" className="text-xs text-emerald-400 hover:underline">Ver todas ›</a>
                  </div>
                  <div className="space-y-2">
                    {[
                      { title: 'Avance de obra - Mayo 2024', date: '12 May 2024' },
                      { title: 'Actualización de proyecto', date: '28 Abr 2024' }
                    ].map((news, idx) => (
                      <div key={idx} className="bg-emerald-950/40 border border-emerald-800/40 rounded-xl p-2.5 flex items-center justify-between cursor-pointer hover:bg-emerald-900/30 transition">
                        <div className="flex items-center gap-3">
                          <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=150&q=80" className="w-12 h-10 rounded-lg object-cover" />
                          <div>
                            <p className="text-xs font-bold text-white">{news.title}</p>
                            <p className="text-[10px] text-slate-400">{news.date}</p>
                          </div>
                        </div>
                        <span className="text-slate-400 text-sm">›</span>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            ) : (
              <>
                {/* ==================== VISTA: INICIO ==================== */}
                {activeTab === 'inicio' && (
                  <div className="home-dashboard animate-fadeIn overflow-hidden">

                    {/* HERO */}
                    <section className="home-hero relative overflow-hidden rounded-b-[34px] md:rounded-[0_0_36px_36px]">
                      <div className="absolute inset-0 bg-[#020b24]"></div>

                      <div
                        className="absolute inset-0 opacity-65"
                        style={{
                          backgroundImage: "linear-gradient(90deg, #020b24 0%, rgba(2,11,36,.90) 22%, rgba(2,11,36,.32) 68%, rgba(2,11,36,.08) 100%), linear-gradient(180deg, rgba(0,45,130,.22), rgba(0,10,30,.55)), url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=1800&q=88')",
                          backgroundSize: 'cover',
                          backgroundPosition: 'center'
                        }}
                      ></div>

                        ].map(item => (
                          <button key={item.id} onClick={() => setProfileSection(item.id)} className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between text-left hover:bg-slate-800/60 transition">
                            <div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-base">{item.icon}</div><div><p className="text-xs font-bold text-white">{item.title}</p><p className="text-[10px] text-slate-400">{item.sub}</p></div></div><span className="text-slate-400 text-base">›</span>
                          </button>
                        ))}
                        <div onClick={() => supabase.auth.signOut()} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between cursor-pointer hover:bg-red-950/30 transition"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-red-950/80 border border-red-800/50 flex items-center justify-center text-red-400 text-base">🚪</div><div><p className="text-xs font-bold text-white">Cerrar sesión</p><p className="text-[10px] text-slate-400">Salir de tu cuenta de WeBlock</p></div></div><span className="text-slate-400 text-base">›</span></div>
                      </div>

                      <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-blue-950/80 border border-blue-800/50 flex items-center justify-center text-blue-400 text-lg">🎧</div><div><p className="text-xs font-bold text-white">¿Necesitás ayuda?</p><p className="text-[10px] text-slate-400">Nuestro equipo está disponible<br/>de Lunes a Viernes de 9 a 18 hs.</p></div></div><button onClick={() => setProfileSection('soporte')} className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-600/30">Contactar soporte</button></div>
                    </div>
                  )
                )}
              </>
            )}
          </main>

          {/* BOTONERA INFERIOR (MÓVIL) FIEL A LAS IMÁGENES */}
          <div className="md:hidden fixed bottom-0 inset-x-0 bg-[#020510]/95 backdrop-blur-md border-t border-slate-800/80 py-2.5 px-6 flex justify-around items-center z-50">
            {[
              { id: 'inicio', label: 'Inicio', icon: IconInicio },
              { id: 'proyectos', label: 'Proyectos', icon: IconProyectos },
              { id: 'movimientos', label: 'Movimientos', icon: IconMovimientos },
              { id: 'perfil', label: 'Perfil', icon: IconPerfil },
            ].map(tab => {
              const Icon = tab.icon;
              const isActive = activeTab === tab.id && !selectedProject;
              return (
                <button 
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); setSelectedProject(null); }}
                  className="flex flex-col items-center gap-1 relative"
                >
                  <Icon active={isActive} />
                  <span className={`text-[10px] ${isActive ? 'text-blue-500 font-bold' : 'text-slate-500'}`}>{tab.label}</span>
                  {isActive && <div className="w-5 h-0.5 bg-blue-500 rounded-full mt-0.5"></div>}
                </button>
              );
            })}
          </div>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
