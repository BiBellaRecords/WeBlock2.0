<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>WeBlock - Inversiones Inmobiliarias</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #020617;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-serif-title { font-family: 'Playfair Display', serif; }

    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Estilos para el solapamiento en cascada de tarjetas de Proyectos */
    .stacked-container {
      display: flex;
      flex-direction: column;
    }

    .stacked-card {
      margin-bottom: -130px; /* Hace que la tarjeta siguiente se solape sobre la anterior */
      transition: transform 0.25s ease, margin 0.25s ease;
      position: relative;
    }

    .stacked-card:last-child {
      margin-bottom: 0;
    }

    .stacked-card:hover {
      transform: translateY(-8px);
      z-index: 30 !important;
    }

    /* Estilos dinámicos para los bordes brillantes tipo Neón */
    .card-blue {
      background: linear-gradient(135deg, #0b1a3e 0%, #050b1a 100%);
      border: 1px solid #1d4ed8;
      box-shadow: 0 10px 25px -5px rgba(29, 78, 216, 0.4);
    }
    .card-green {
      background: linear-gradient(135deg, #042318 0%, #02120b 100%);
      border: 1px solid #10b981;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
    }
    .card-amber {
      background: linear-gradient(135deg, #2a1c04 0%, #120b02 100%);
      border: 1px solid #d97706;
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.3);
    }
    .card-purple {
      background: linear-gradient(135deg, #1d0b30 0%, #0d0417 100%);
      border: 1px solid #8b5cf6;
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.3);
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-full">

  <div id="root" class="w-full h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONFIGURACIÓN SUPABASE ---
    // Reemplaza con tus llaves reales de Supabase
    const SUPABASE_URL = "https://jyqavprfowwhzjfcwlsh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WIxlCKHdUlFBJM--qnpQ0w_VlU_CM3i";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- LOGO WEBLOCK ---
    const WeBlockLogo = () => (
      <div class="w-7 h-7 relative flex items-center justify-center">
        <svg viewBox="0 0 100 100" className="w-full h-full">
          <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" fill="none" stroke="#2563eb" strokeWidth="8" />
          <path d="M50 10 L85 30 L50 50 L15 30 Z" fill="#2563eb" opacity="0.6" />
          <path d="M50 50 L85 30 L85 70 L50 90 Z" fill="#1d4ed8" />
          <path d="M50 50 L15 30 L15 70 L50 90 Z" fill="#3b82f6" opacity="0.8" />
        </svg>
      </div>
    );

    // --- ICONOS DE LA BOTONERA INFERIOR (1:1 CON FOTOS) ---
    const IconInicio = ({ active }) => (
      <svg class={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill={active ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
    );

    const IconProyectos = ({ active }) => (
      <svg class={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4M9 7h1m-1 4h1m4-4h1m-1 4h1" />
      </svg>
    );

    const IconMovimientos = ({ active }) => (
      <svg class={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path d="M8 7h12m0 0l-4-4m4 4l-4 4m-8 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconPerfil = ({ active }) => (
      <svg class={`w-6 h-6 ${active ? 'text-blue-500' : 'text-slate-500'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );

    // --- PANTALLA DE AUTENTICACIÓN / REGISTRO SUPABASE ---
    const AuthScreen = ({ onAuthSuccess }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [nombre, setNombre] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        try {
          if (isLogin) {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            onAuthSuccess(data.user);
          } else {
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: { data: { full_name: nombre } }
            });
            if (error) throw error;
            onAuthSuccess(data.user);
          }
        } catch (err) {
          setErrorMsg(err.message || 'Ocurrió un error en la autenticación');
        }
      };

      return (
        <div class="fixed inset-0 bg-[#020617] z-50 flex flex-col justify-center px-6">
          <div class="flex flex-col items-center mb-8">
            <WeBlockLogo />
            <h1 class="text-3xl font-bold tracking-tight mt-2">We<span class="text-blue-500">Block</span></h1>
            <p class="text-xs text-slate-400 mt-1">{isLogin ? 'Ingresá a tu cuenta' : 'Creá tu cuenta de inversor'}</p>
          </div>

          <form onSubmit={handleSubmit} class="space-y-4 max-w-sm mx-auto w-full">
            {!isLogin && (
              <div>
                <label class="text-xs text-slate-400 block mb-1">Nombre Completo</label>
                <input 
                  type="text" 
                  value={nombre} 
                  onChange={(e) => setNombre(e.target.value)} 
                  required
                  class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none"
                  placeholder="Ej: Joaquín"
                />
              </div>
            )}

            <div>
              <label class="text-xs text-slate-400 block mb-1">Email</label>
              <input 
                type="email" 
                value={email} 
                onChange={(e) => setEmail(e.target.value)} 
                required
                class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none"
                placeholder="tu@email.com"
              />
            </div>

            <div>
              <label class="text-xs text-slate-400 block mb-1">Contraseña</label>
              <input 
                type="password" 
                value={password} 
                onChange={(e) => setPassword(e.target.value)} 
                required
                class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none"
                placeholder="••••••••"
              />
            </div>

            {errorMsg && <p class="text-xs text-red-400 text-center">{errorMsg}</p>}

            <button type="submit" class="w-full py-3.5 rounded-xl bg-blue-600 font-bold text-sm hover:bg-blue-500 transition">
              {isLogin ? 'Iniciar Sesión' : 'Registrarse'}
            </button>

            <p class="text-xs text-center text-slate-400 mt-4 cursor-pointer" onClick={() => setIsLogin(!isLogin)}>
              {isLogin ? '¿No tenés cuenta? Registrate aquí' : '¿Ya tenés cuenta? Iniciá sesión'}
            </p>
          </form>
        </div>
      );
    };

    // --- APLICACIÓN PRINCIPAL ---
    const App = () => {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('inicio');
      const [selectedProject, setSelectedProject] = useState(null);

      useEffect(() => {
        // Verificar sesión activa en Supabase
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) setUser(session.user);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      if (!user) {
        return <AuthScreen onAuthSuccess={(u) => setUser(u)} />;
      }

      return (
        <div class="w-full h-full flex flex-col md:flex-row bg-[#020617] overflow-hidden relative">
          
          {/* BARRA LATERAL (PC) */}
          <aside class="hidden md:flex flex-col w-64 border-r border-slate-800/80 p-6 space-y-8 bg-[#030712] shrink-0">
            <div class="flex items-center gap-3">
              <WeBlockLogo />
              <span class="text-xl font-bold tracking-wider">We<span class="text-blue-500">Block</span></span>
            </div>

            <nav class="flex flex-col space-y-2">
              {[
                { id: 'inicio', label: 'Inicio', icon: IconInicio },
                { id: 'proyectos', label: 'Proyectos', icon: IconProyectos },
                { id: 'movimientos', label: 'Movimientos', icon: IconMovimientos },
                { id: 'perfil', label: 'Perfil', icon: IconPerfil },
              ].map(item => {
                const Icon = item.icon;
                return (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setSelectedProject(null); }}
                    class={`flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition ${activeTab === item.id && !selectedProject ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800/50'}`}
                  >
                    <Icon active={activeTab === item.id} />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main class={`flex-1 overflow-y-auto w-full max-w-7xl mx-auto p-4 md:p-10 pb-28 ${selectedProject === 'Distrito Verde' ? 'bg-[#02120b]' : ''}`}>
            
            {/* VISTA DETALLE: DISTRITO VERDE */}
            {selectedProject === 'Distrito Verde' ? (
              <div class="space-y-5 max-w-2xl mx-auto">
                <div class="flex justify-between items-center">
                  <button onClick={() => setSelectedProject(null)} class="w-10 h-10 rounded-full bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-xl font-bold">‹</button>
                  <button class="w-10 h-10 rounded-full bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-sm">•••</button>
                </div>

                <div>
                  <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-medium border border-emerald-500/30 mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> En preventa
                  </span>
                  <h1 class="text-3xl md:text-4xl font-serif-title font-bold text-white">Distrito Verde</h1>
                  <p class="text-xs text-slate-400 mt-1">Desarrolladora Urbana</p>
                  <p class="text-xs text-emerald-200/70 mt-2">Un proyecto residencial sustentable en el corazón de la ciudad.</p>
                </div>

                <div class="bg-gradient-to-br from-emerald-950/90 to-emerald-900/40 border border-emerald-800/60 rounded-2xl p-5 space-y-4">
                  <div>
                    <p class="text-[10px] text-emerald-300/70 uppercase tracking-wider font-semibold">Tu inversión total</p>
                    <h2 class="text-3xl font-black text-white">$35.000.000</h2>
                  </div>
                  
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs pt-2 border-t border-emerald-800/40">
                    <div>
                      <p class="text-[10px] text-slate-400">Participación</p>
                      <p class="font-bold text-white text-sm">1,85%</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-slate-400">Tokens adquiridos</p>
                      <p class="font-bold text-white text-sm">35.000</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-slate-400">Rentabilidad estimada</p>
                      <p class="font-bold text-emerald-400 text-sm">11,2%</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-slate-400">Rendimiento acumulado</p>
                      <p class="font-bold text-emerald-400 text-sm">+$2.450.000</p>
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="bg-emerald-950/40 border border-emerald-900/50 rounded-2xl p-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-800/30 text-emerald-400 flex items-center justify-center text-lg">📈</div>
                    <div>
                      <p class="text-[10px] text-slate-400">Próximo pago estimado</p>
                      <p class="text-xs font-bold text-white">15 de Agosto 2024</p>
                      <p class="text-sm font-extrabold text-emerald-400">$1.250.000</p>
                    </div>
                  </div>

                  <div class="bg-emerald-950/40 border border-emerald-900/50 rounded-2xl p-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-800/30 text-emerald-400 flex items-center justify-center text-lg">📅</div>
                    <div>
                      <p class="text-[10px] text-slate-400">Frecuencia de pagos</p>
                      <p class="text-sm font-bold text-white">Trimestral</p>
                    </div>
                  </div>
                </div>

                <div class="bg-emerald-950/40 border border-emerald-900/50 rounded-2xl p-4">
                  <div class="flex justify-between items-center mb-2">
                    <div>
                      <p class="text-[10px] text-slate-400">Avance de obra</p>
                      <p class="text-2xl font-black text-white">38%</p>
                    </div>
                    <div class="w-20 h-12 bg-slate-800 rounded-lg overflow-hidden border border-emerald-800/40 bg-cover bg-center" style={{backgroundImage: "url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=200&q=80')"}}></div>
                  </div>
                  <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                    <div class="bg-emerald-500 h-full w-[38%] rounded-full"></div>
                  </div>
                  <p class="text-[10px] text-slate-500 mt-2">Última actualización: 12 May 2024</p>
                </div>
              </div>
            ) : (
              <>
                {/* VISTA: INICIO */}
                {activeTab === 'inicio' && (
                  <div class="space-y-6">
                    <div class="flex md:hidden justify-between items-center">
                      <div class="flex items-center gap-2">
                        <WeBlockLogo />
                        <span class="text-lg font-bold">We<span class="text-blue-500">Block</span></span>
                      </div>
                    </div>

                    <div>
                      <p class="text-slate-400 text-sm">Buenos días,</p>
                      <h2 class="text-3xl font-extrabold text-white tracking-tight">{user.user_metadata?.full_name || 'Joaquín'}</h2>
                      <p class="text-xs text-slate-500 mt-1">Patrimonio actualizado hoy 14:36</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                      <div class="glass-card rounded-2xl p-6 bg-gradient-to-br from-blue-900/40 via-slate-900 to-slate-950 border border-blue-500/30">
                        <p class="text-xs uppercase text-blue-300 font-semibold mb-1">Mi Patrimonio</p>
                        <h3 class="text-3xl md:text-4xl font-black text-white">$245.300.000</h3>
                        <span class="inline-block mt-3 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
                          ↑ +12,4% este año
                        </span>
                      </div>

                      <div class="glass-card rounded-2xl p-5 border border-slate-800 flex justify-between items-center">
                        <div>
                          <p class="text-[10px] uppercase text-slate-400 font-bold">Próximo Cobro</p>
                          <p class="text-lg font-bold text-white">15 de Agosto</p>
                          <p class="text-xs text-slate-500">en 18 días</p>
                        </div>
                        <div class="text-right">
                          <p class="text-[10px] uppercase text-slate-400 font-bold">Monto Estimado</p>
                          <p class="text-lg font-extrabold text-blue-400">$2.350.000</p>
                        </div>
                      </div>

                      <div class="glass-card rounded-2xl p-5 border border-slate-800 flex justify-between items-center">
                        <div>
                          <p class="text-[10px] uppercase text-slate-400 font-bold">Estado General</p>
                          <p class="text-base font-bold text-white">Activos y en desarrollo</p>
                          <p class="text-xs text-emerald-400">Rendimiento: +12,4%</p>
                        </div>
                        <div class="w-12 h-12 rounded-full border-4 border-blue-600 border-t-slate-800 flex items-center justify-center text-center">
                          <p class="text-xs font-black">12</p>
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setActiveTab('proyectos')}
                      class="w-full md:w-auto px-8 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg shadow-blue-600/30 transition"
                    >
                      Ver mis inversiones ›
                    </button>
                  </div>
                )}

                {/* VISTA: PROYECTOS (DISEÑO SOLAPADO 1:1 CON FOTOS) */}
                {activeTab === 'proyectos' && (
                  <div class="space-y-6">
                    <div class="flex justify-between items-center">
                      <div>
                        <h2 class="text-3xl font-extrabold text-white">Proyectos</h2>
                        <p class="text-xs text-slate-400">Tus inversiones en desarrollo</p>
                      </div>
                      <button class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-white text-xl font-light">+</button>
                    </div>

                    {/* Contenedor de Tarjetas Apiladas / Solapadas */}
                    <div class="stacked-container relative pt-2">
                      
                      {/* TARJETA 1: Torre Norte (Azul - Expansiva arriba) */}
                      <div 
                        onClick={() => setSelectedProject('Torre Norte')}
                        class="stacked-card card-blue rounded-3xl p-5 cursor-pointer z-20 flex justify-between overflow-hidden min-h-[300px]"
                      >
                        <div class="flex-1 pr-4">
                          <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-blue-500/20 text-blue-300 text-[11px] font-medium border border-blue-400/30 mb-3">
                            <span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span> En construcción
                          </span>
                          <h3 class="text-3xl font-serif-title font-bold text-white">Torre Norte</h3>
                          <p class="text-xs text-slate-400">Desarrolladora Urbana</p>

                          <div class="mt-6">
                            <p class="text-[11px] text-slate-400">Rentabilidad anual estimada</p>
                            <p class="text-2xl font-bold text-blue-400">12,4%</p>
                          </div>

                          <div class="mt-4">
                            <p class="text-[11px] text-slate-400">Tu inversión</p>
                            <p class="text-2xl font-extrabold text-white">$50.000.000</p>
                          </div>

                          <div class="mt-4 flex gap-6">
                            <div>
                              <p class="text-[10px] text-slate-400">Participación</p>
                              <p class="text-xs font-bold text-white">2,35%</p>
                            </div>
                            <div>
                              <p class="text-[10px] text-slate-400">Tokens</p>
                              <p class="text-xs font-bold text-white">50.000</p>
                            </div>
                          </div>
                        </div>

                        {/* Imagen del Edificio en el lateral derecho */}
                        <div class="w-36 h-full absolute right-0 top-0 bottom-0 overflow-hidden rounded-r-3xl">
                          <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover opacity-80" />
                          <div class="absolute inset-0 bg-gradient-to-r from-[#0b1a3e] via-transparent to-transparent"></div>
                          <div class="absolute bottom-5 right-5 w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white text-lg font-bold shadow-lg">→</div>
                        </div>
                      </div>

                      {/* TARJETA 2: Distrito Verde (Verde Neón) */}
                      <div 
                        onClick={() => setSelectedProject('Distrito Verde')}
                        class="stacked-card card-green rounded-3xl p-5 cursor-pointer z-15 flex justify-between overflow-hidden min-h-[220px]"
                      >
                        <div class="flex-1 pr-4">
                          <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] font-medium border border-emerald-400/30 mb-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> En preventa
                          </span>
                          <h3 class="text-2xl font-serif-title font-bold text-white">Distrito Verde</h3>
                          <p class="text-xs text-slate-400">Desarrolladora Urbana</p>
                        </div>

                        <div class="w-32 h-full absolute right-0 top-0 bottom-0 overflow-hidden rounded-r-3xl">
                          <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover opacity-60" />
                          <div class="absolute inset-0 bg-gradient-to-r from-[#042318] via-transparent to-transparent"></div>
                          <div class="absolute top-5 right-5 w-9 h-9 rounded-full bg-emerald-900/80 border border-emerald-500/40 flex items-center justify-center text-emerald-300 font-bold">→</div>
                        </div>
                      </div>

                      {/* TARJETA 3: Altos del Sur (Amarillo/Ámbar) */}
                      <div class="stacked-card card-amber rounded-3xl p-5 cursor-pointer z-10 flex justify-between overflow-hidden min-h-[220px]">
                        <div class="flex-1 pr-4">
                          <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[11px] font-medium border border-amber-400/30 mb-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> En obra
                          </span>
                          <h3 class="text-2xl font-serif-title font-bold text-white">Altos del Sur</h3>
                          <p class="text-xs text-slate-400">Desarrolladora Urbana</p>
                        </div>

                        <div class="w-32 h-full absolute right-0 top-0 bottom-0 overflow-hidden rounded-r-3xl">
                          <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover opacity-60" />
                          <div class="absolute inset-0 bg-gradient-to-r from-[#2a1c04] via-transparent to-transparent"></div>
                          <div class="absolute top-5 right-5 w-9 h-9 rounded-full bg-amber-900/80 border border-amber-500/40 flex items-center justify-center text-amber-300 font-bold">→</div>
                        </div>
                      </div>

                      {/* TARJETA 4: Costanera View (Violeta) */}
                      <div class="stacked-card card-purple rounded-3xl p-5 cursor-pointer z-5 flex justify-between overflow-hidden min-h-[220px]">
                        <div class="flex-1 pr-4">
                          <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-purple-500/20 text-purple-300 text-[11px] font-medium border border-purple-400/30 mb-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span> Finalizado
                          </span>
                          <h3 class="text-2xl font-serif-title font-bold text-white">Costanera View</h3>
                          <p class="text-xs text-slate-400">Desarrolladora Urbana</p>
                        </div>

                        <div class="w-32 h-full absolute right-0 top-0 bottom-0 overflow-hidden rounded-r-3xl">
                          <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover opacity-60" />
                          <div class="absolute inset-0 bg-gradient-to-r from-[#1d0b30] via-transparent to-transparent"></div>
                          <div class="absolute top-5 right-5 w-9 h-9 rounded-full bg-purple-900/80 border border-purple-500/40 flex items-center justify-center text-purple-300 font-bold">→</div>
                        </div>
                      </div>

                    </div>
                  </div>
                )}

                {/* VISTA: MOVIMIENTOS */}
                {activeTab === 'movimientos' && (
                  <div class="space-y-6 max-w-xl">
                    <div>
                      <h2 class="text-3xl font-extrabold text-white">Movimientos</h2>
                      <p class="text-xs text-slate-400">Historial de transacciones y eventos</p>
                    </div>

                    <div class="glass-card rounded-2xl p-5 grid grid-cols-2 gap-4 border border-slate-800">
                      <div>
                        <p class="text-[10px] text-slate-400">Total invertido</p>
                        <p class="text-xl font-extrabold text-white">$120.250.000</p>
                        <p class="text-[10px] text-blue-400">↑ +8,4% vs. mes anterior</p>
                      </div>
                      <div>
                        <p class="text-[10px] text-slate-400">Total cobrado</p>
                        <p class="text-xl font-extrabold text-emerald-400">$28.450.000</p>
                        <p class="text-[10px] text-emerald-400">↑ +12,7% vs. mes anterior</p>
                      </div>
                    </div>

                    <div class="space-y-3">
                      <div class="glass-card rounded-xl p-4 flex justify-between items-center border border-slate-800">
                        <div>
                          <p class="text-xs font-bold text-white">Cobro de rentabilidad</p>
                          <p class="text-[10px] text-slate-400">Torre Norte • Hoy, 14:32</p>
                        </div>
                        <p class="text-sm font-bold text-emerald-400">+$2.350.000</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* VISTA: PERFIL */}
                {activeTab === 'perfil' && (
                  <div class="space-y-6 max-w-xl">
                    <div>
                      <h2 class="text-3xl font-extrabold text-white">Perfil</h2>
                      <p class="text-xs text-slate-400">Gestioná tu cuenta y preferencias</p>
                    </div>

                    <div class="glass-card rounded-2xl p-5 border border-slate-800">
                      <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-full bg-slate-700 border-2 border-blue-500 overflow-hidden">
                          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover"/>
                        </div>
                        <div>
                          <h3 class="text-lg font-bold text-white">{user.user_metadata?.full_name || 'Inversor'}</h3>
                          <p class="text-xs text-slate-400">{user.email}</p>
                          <span class="text-[10px] text-blue-400 font-semibold">✓ Inversor verificado</span>
                        </div>
                      </div>

                      <button 
                        onClick={() => supabase.auth.signOut()} 
                        class="mt-4 w-full py-2 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs font-bold hover:bg-red-500/20 transition"
                      >
                        Cerrar Sesión
                      </button>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* BOTONERA INFERIOR (MÓVIL 1:1 CON FOTOS) */}
          <div class="md:hidden fixed bottom-0 inset-x-0 bg-[#030712]/95 backdrop-blur-md border-t border-slate-800/80 py-3 px-6 flex justify-around items-center z-40">
            {[
              { id: 'inicio', label: 'Inicio', icon: IconInicio },
              { id: 'proyectos', label: 'Proyectos', icon: IconProyectos },
              { id: 'movimientos', label: 'Movimientos', icon: IconMovimientos },
              { id: 'perfil', label: 'Perfil', icon: IconPerfil },
            ].map(tab => {
              const Icon = tab.icon;
              const isActive = activeTab === tab.id && !selectedProject;
              return (
                <button 
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); setSelectedProject(null); }}
                  class="flex flex-col items-center gap-1 relative"
                >
                  <Icon active={isActive} />
                  <span class={`text-[10px] ${isActive ? 'text-blue-500 font-bold' : 'text-slate-500'}`}>{tab.label}</span>
                  {isActive && <span class="absolute -bottom-2 w-4 h-0.5 bg-blue-500 rounded-full"></span>}
                </button>
              );
            })}
          </div>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
