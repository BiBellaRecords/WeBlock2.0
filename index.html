<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Viewport estrictamente configurado para bloquear zoom en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>WeBlock - Inversiones Inmobiliarias</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* Bloqueo estricto de zoom, gestos y scroll horizontal */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation; /* Evita double-tap zoom en iOS/Android */
      -webkit-text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
      background-color: #020617;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-serif-title { 
      font-family: 'Playfair Display', serif; 
    }

    /* Estilos Glassmorphism */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Tarjetas de Proyectos */
    .card-blue {
      background: linear-gradient(145deg, rgba(13, 27, 62, 0.95), rgba(6, 12, 30, 0.98));
      border: 1px solid #1d4ed8;
      box-shadow: 0 10px 30px -10px rgba(29, 78, 216, 0.3);
    }
    .card-green {
      background: linear-gradient(145deg, rgba(6, 44, 30, 0.95), rgba(3, 20, 14, 0.98));
      border: 1px solid #10b981;
      box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.25);
    }
    .card-amber {
      background: linear-gradient(145deg, rgba(50, 35, 8, 0.95), rgba(22, 15, 3, 0.98));
      border: 1px solid #d97706;
      box-shadow: 0 10px 30px -10px rgba(217, 119, 6, 0.25);
    }
    .card-purple {
      background: linear-gradient(145deg, rgba(38, 16, 62, 0.95), rgba(18, 7, 30, 0.98));
      border: 1px solid #8b5cf6;
      box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.25);
    }

    /* Desactivar scrollbars visibles para dar estética nativa */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-full">

  <div id="root" class="w-full h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Componente del Logo WeBlock
    const WeBlockLogo = () => (
      <div class="w-7 h-7 relative flex items-center justify-center">
        <svg viewBox="0 0 100 100" className="w-full h-full">
          <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" fill="none" stroke="#2563eb" strokeWidth="8" />
          <path d="M50 10 L85 30 L50 50 L15 30 Z" fill="#2563eb" opacity="0.6" />
          <path d="M50 50 L85 30 L85 70 L50 90 Z" fill="#1d4ed8" />
          <path d="M50 50 L15 30 L15 70 L50 90 Z" fill="#3b82f6" opacity="0.8" />
        </svg>
      </div>
    );

    // Pantalla de Animación Inicial / Logo (Splash Screen)
    const SplashScreen = ({ onComplete }) => {
      useEffect(() => {
        const timer = setTimeout(onComplete, 2200);
        return () => clearTimeout(timer);
      }, []);

      return (
        <div class="fixed inset-0 bg-[#020617] z-50 flex flex-col items-center justify-center">
          <div class="flex flex-col items-center gap-4">
            <div class="w-16 h-16">
              <WeBlockLogo />
            </div>
            <h1 class="text-3xl font-extrabold tracking-wider text-white">We<span class="text-blue-500">Block</span></h1>
          </div>
          <div class="absolute bottom-12 w-16 h-1 bg-slate-800 rounded-full overflow-hidden">
            <div class="w-full h-full bg-blue-500 animate-pulse"></div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('inicio');
      const [selectedProject, setSelectedProject] = useState(null);

      if (loading) {
        return <SplashScreen onComplete={() => setLoading(false)} />;
      }

      return (
        <div class="w-full h-full flex flex-col md:flex-row bg-[#020617] overflow-hidden">
          
          {/* BARRA LATERAL (Solo en PC) */}
          <aside class="hidden md:flex flex-col w-64 border-r border-slate-800/80 p-6 space-y-8 bg-[#030712] shrink-0">
            <div class="flex items-center gap-3">
              <WeBlockLogo />
              <span class="text-xl font-bold tracking-wider">We<span class="text-blue-500">Block</span></span>
            </div>

            <nav class="flex flex-col space-y-2">
              {[
                { id: 'inicio', label: 'Inicio', icon: '🏠' },
                { id: 'proyectos', label: 'Proyectos', icon: '🏢' },
                { id: 'movimientos', label: 'Movimientos', icon: '⇄' },
                { id: 'perfil', label: 'Perfil', icon: '👤' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => { setActiveTab(item.id); setSelectedProject(null); }}
                  class={`flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition ${activeTab === item.id && !selectedProject ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50'}`}
                >
                  <span class="text-lg">{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              ))}
            </nav>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main class={`flex-1 overflow-y-auto w-full max-w-7xl mx-auto p-4 md:p-10 pb-24 md:pb-10 ${selectedProject === 'Distrito Verde' ? 'bg-[#02120b]' : ''}`}>
            
            {/* VISTA DETALLE: DISTRITO VERDE */}
            {selectedProject === 'Distrito Verde' ? (
              <div class="space-y-5 max-w-2xl mx-auto">
                <div class="flex justify-between items-center">
                  <button onClick={() => setSelectedProject(null)} class="w-10 h-10 rounded-full bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-xl font-bold">‹</button>
                  <button class="w-10 h-10 rounded-full bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-emerald-400 text-sm">•••</button>
                </div>

                <div>
                  <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-medium border border-emerald-500/30 mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> En preventa
                  </span>
                  <h1 class="text-3xl md:text-4xl font-serif-title font-bold text-white">Distrito Verde</h1>
                  <p class="text-xs text-slate-400 mt-1">Desarrolladora Urbana</p>
                  <p class="text-xs text-emerald-200/70 mt-2">Un proyecto residencial sustentable en el corazón de la ciudad.</p>
                </div>

                <div class="bg-gradient-to-br from-emerald-950/90 to-emerald-900/40 border border-emerald-800/60 rounded-2xl p-5 space-y-4">
                  <div>
                    <p class="text-[10px] text-emerald-300/70 uppercase tracking-wider font-semibold">Tu inversión total</p>
                    <h2 class="text-3xl font-black text-white">$35.000.000</h2>
                  </div>
                  
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs pt-2 border-t border-emerald-800/40">
                    <div>
                      <p class="text-[10px] text-slate-400">Participación</p>
                      <p class="font-bold text-white text-sm">1,85%</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-slate-400">Tokens adquiridos</p>
                      <p class="font-bold text-white text-sm">35.000</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-slate-400">Rentabilidad estimada</p>
                      <p class="font-bold text-emerald-400 text-sm">11,2%</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-slate-400">Rendimiento acumulado</p>
                      <p class="font-bold text-emerald-400 text-sm">+$2.450.000</p>
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="bg-emerald-950/40 border border-emerald-900/50 rounded-2xl p-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-800/30 text-emerald-400 flex items-center justify-center text-lg">📈</div>
                    <div>
                      <p class="text-[10px] text-slate-400">Próximo pago estimado</p>
                      <p class="text-xs font-bold text-white">15 de Agosto 2024</p>
                      <p class="text-sm font-extrabold text-emerald-400">$1.250.000</p>
                    </div>
                  </div>

                  <div class="bg-emerald-950/40 border border-emerald-900/50 rounded-2xl p-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-800/30 text-emerald-400 flex items-center justify-center text-lg">📅</div>
                    <div>
                      <p class="text-[10px] text-slate-400">Frecuencia de pagos</p>
                      <p class="text-sm font-bold text-white">Trimestral</p>
                    </div>
                  </div>
                </div>

                <div class="bg-emerald-950/40 border border-emerald-900/50 rounded-2xl p-4">
                  <div class="flex justify-between items-center mb-2">
                    <div>
                      <p class="text-[10px] text-slate-400">Avance de obra</p>
                      <p class="text-2xl font-black text-white">38%</p>
                    </div>
                    <div class="w-20 h-12 bg-slate-800 rounded-lg overflow-hidden border border-emerald-800/40 bg-cover bg-center" style={{backgroundImage: "url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=200&q=80')"}}></div>
                  </div>
                  <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                    <div class="bg-emerald-500 h-full w-[38%] rounded-full"></div>
                  </div>
                  <p class="text-[10px] text-slate-500 mt-2">Última actualización: 12 May 2024</p>
                </div>
              </div>
            ) : (
              <>
                {/* VISTA: INICIO */}
                {activeTab === 'inicio' && (
                  <div class="space-y-6">
                    <div class="flex md:hidden justify-between items-center">
                      <div class="flex items-center gap-2">
                        <WeBlockLogo />
                        <span class="text-lg font-bold">We<span class="text-blue-500">Block</span></span>
                      </div>
                    </div>

                    <div>
                      <p class="text-slate-400 text-sm">Buenos días,</p>
                      <h2 class="text-3xl font-extrabold text-white tracking-tight">Joaquín</h2>
                      <p class="text-xs text-slate-500 mt-1">Patrimonio actualizado hoy 14:36</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                      <div class="glass-card rounded-2xl p-6 bg-gradient-to-br from-blue-900/40 via-slate-900 to-slate-950 border border-blue-500/30">
                        <p class="text-xs uppercase text-blue-300 font-semibold mb-1">Mi Patrimonio</p>
                        <h3 class="text-3xl md:text-4xl font-black text-white">$245.300.000</h3>
                        <span class="inline-block mt-3 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
                          ↑ +12,4% este año
                        </span>
                      </div>

                      <div class="glass-card rounded-2xl p-5 border border-slate-800 flex justify-between items-center">
                        <div>
                          <p class="text-[10px] uppercase text-slate-400 font-bold">Próximo Cobro</p>
                          <p class="text-lg font-bold text-white">15 de Agosto</p>
                          <p class="text-xs text-slate-500">en 18 días</p>
                        </div>
                        <div class="text-right">
                          <p class="text-[10px] uppercase text-slate-400 font-bold">Monto Estimado</p>
                          <p class="text-lg font-extrabold text-blue-400">$2.350.000</p>
                        </div>
                      </div>

                      <div class="glass-card rounded-2xl p-5 border border-slate-800 flex justify-between items-center">
                        <div>
                          <p class="text-[10px] uppercase text-slate-400 font-bold">Estado General</p>
                          <p class="text-base font-bold text-white">Activos y en desarrollo</p>
                          <p class="text-xs text-emerald-400">Rendimiento: +12,4%</p>
                        </div>
                        <div class="w-12 h-12 rounded-full border-4 border-blue-600 border-t-slate-800 flex items-center justify-center text-center">
                          <p class="text-xs font-black">12</p>
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setActiveTab('proyectos')}
                      class="w-full md:w-auto px-8 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg shadow-blue-600/30 transition"
                    >
                      Ver mis inversiones ›
                    </button>
                  </div>
                )}

                {/* VISTA: PROYECTOS */}
                {activeTab === 'proyectos' && (
                  <div class="space-y-6">
                    <div class="flex justify-between items-end">
                      <div>
                        <h2 class="text-3xl font-extrabold text-white">Proyectos</h2>
                        <p class="text-xs text-slate-400">Tus inversiones en desarrollo</p>
                      </div>
                    </div>

                    {/* En PC se ven en Grid de 2 columnas, en Celular 1 columna vertical */}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div onClick={() => setSelectedProject('Torre Norte')} class="card-blue rounded-3xl p-5 cursor-pointer">
                        <span class="inline-block px-3 py-0.5 rounded-full bg-blue-500/20 text-blue-300 text-[11px] font-medium border border-blue-400/30 mb-3">
                          • En construcción
                        </span>
                        <h3 class="text-2xl font-serif-title font-bold text-white">Torre Norte</h3>
                        <p class="text-xs text-slate-400 mb-4">Desarrolladora Urbana</p>
                        <p class="text-xs text-slate-400">Rentabilidad anual estimada</p>
                        <p class="text-2xl font-bold text-blue-400">12,4%</p>
                        <p class="text-xs text-slate-400 mt-3">Tu inversión</p>
                        <p class="text-2xl font-extrabold text-white">$50.000.000</p>
                      </div>

                      <div onClick={() => setSelectedProject('Distrito Verde')} class="card-green rounded-3xl p-5 cursor-pointer">
                        <span class="inline-block px-3 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] font-medium border border-emerald-400/30 mb-3">
                          • En preventa
                        </span>
                        <h3 class="text-2xl font-serif-title font-bold text-white">Distrito Verde</h3>
                        <p class="text-xs text-slate-400 mb-4">Desarrolladora Urbana</p>
                        <p class="text-xs text-slate-400">Rentabilidad anual estimada</p>
                        <p class="text-2xl font-bold text-emerald-400">11,2%</p>
                        <p class="text-xs text-slate-400 mt-3">Tu inversión</p>
                        <p class="text-2xl font-extrabold text-white">$35.000.000</p>
                      </div>

                      <div class="card-amber rounded-3xl p-5 cursor-pointer">
                        <span class="inline-block px-3 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[11px] font-medium border border-amber-400/30 mb-3">
                          • En obra
                        </span>
                        <h3 class="text-2xl font-serif-title font-bold text-white">Altos del Sur</h3>
                        <p class="text-xs text-slate-400">Desarrolladora Urbana</p>
                      </div>

                      <div class="card-purple rounded-3xl p-5 cursor-pointer">
                        <span class="inline-block px-3 py-0.5 rounded-full bg-purple-500/20 text-purple-300 text-[11px] font-medium border border-purple-400/30 mb-3">
                          • Finalizado
                        </span>
                        <h3 class="text-2xl font-serif-title font-bold text-white">Costanera View</h3>
                        <p class="text-xs text-slate-400">Desarrolladora Urbana</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* VISTA: MOVIMIENTOS */}
                {activeTab === 'movimientos' && (
                  <div class="space-y-6">
                    <div>
                      <h2 class="text-3xl font-extrabold text-white">Movimientos</h2>
                      <p class="text-xs text-slate-400">Historial de transacciones y eventos</p>
                    </div>

                    <div class="glass-card rounded-2xl p-5 grid grid-cols-2 gap-4 border border-slate-800 max-w-xl">
                      <div>
                        <p class="text-[10px] text-slate-400">Total invertido</p>
                        <p class="text-xl font-extrabold text-white">$120.250.000</p>
                        <p class="text-[10px] text-blue-400">↑ +8,4% vs. mes anterior</p>
                      </div>
                      <div>
                        <p class="text-[10px] text-slate-400">Total cobrado</p>
                        <p class="text-xl font-extrabold text-emerald-400">$28.450.000</p>
                        <p class="text-[10px] text-emerald-400">↑ +12,7% vs. mes anterior</p>
                      </div>
                    </div>

                    <div class="space-y-3 max-w-xl">
                      <div class="glass-card rounded-xl p-4 flex justify-between items-center border border-slate-800">
                        <div>
                          <p class="text-xs font-bold text-white">Cobro de rentabilidad</p>
                          <p class="text-[10px] text-slate-400">Torre Norte • Hoy, 14:32</p>
                        </div>
                        <p class="text-sm font-bold text-emerald-400">+$2.350.000</p>
                      </div>

                      <div class="glass-card rounded-xl p-4 flex justify-between items-center border border-slate-800">
                        <div>
                          <p class="text-xs font-bold text-white">Inversión realizada</p>
                          <p class="text-[10px] text-slate-400">Distrito Verde • Hoy, 11:08</p>
                        </div>
                        <p class="text-sm font-bold text-white">-$5.000.000</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* VISTA: PERFIL */}
                {activeTab === 'perfil' && (
                  <div class="space-y-6 max-w-xl">
                    <div>
                      <h2 class="text-3xl font-extrabold text-white">Perfil</h2>
                      <p class="text-xs text-slate-400">Gestioná tu cuenta y preferencias</p>
                    </div>

                    <div class="glass-card rounded-2xl p-5 border border-slate-800">
                      <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-full bg-slate-700 border-2 border-blue-500 overflow-hidden">
                          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="w-full h-full object-cover"/>
                        </div>
                        <div>
                          <h3 class="text-lg font-bold text-white">Axel DiBella</h3>
                          <p class="text-xs text-slate-400">axel.dibella@gmail.com</p>
                          <span class="text-[10px] text-blue-400 font-semibold">✓ Inversor verificado</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* BOTONERA INFERIOR (Solo en Celular) */}
          <div class="md:hidden fixed bottom-0 inset-x-0 bg-[#030712]/95 backdrop-blur-md border-t border-slate-800/80 py-3 px-6 flex justify-around items-center z-40">
            {[
              { id: 'inicio', label: 'Inicio', icon: '🏠' },
              { id: 'proyectos', label: 'Proyectos', icon: '🏢' },
              { id: 'movimientos', label: 'Movimientos', icon: '⇄' },
              { id: 'perfil', label: 'Perfil', icon: '👤' },
            ].map(tab => (
              <button 
                key={tab.id}
                onClick={() => { setActiveTab(tab.id); setSelectedProject(null); }}
                class={`flex flex-col items-center gap-1 ${activeTab === tab.id && !selectedProject ? 'text-blue-500 font-bold' : 'text-slate-500'}`}
              >
                <span class="text-lg">{tab.icon}</span>
                <span class="text-[10px]">{tab.label}</span>
              </button>
            ))}
          </div>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
